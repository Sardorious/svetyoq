[project]
name = "sveta"
version = "0.1.0"
description = "Sveta.Net — elektr uzilishlari haqida jamoaviy xabar tizimi"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "geoalchemy2>=0.15",
    "aiogram>=3.15",
    "h3>=4.1",
    "apscheduler>=3.10",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "anyio>=4.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.core.i18n" = ["locales/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# UP017: `datetime.UTC` faqat 3.11+ da bor. `timezone.utc` ikkala versiyada
# ham ishlaydi va testlarni eski interpretatorda ham ishga tushirish imkonini beradi.
ignore = ["UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "requires_db: PostGIS bilan ishlaydigan test (sandboxda o'tkazib yuboriladi)",
]
