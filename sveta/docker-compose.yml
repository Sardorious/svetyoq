name: sveta

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sveta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sveta}
      POSTGRES_DB: ${POSTGRES_DB:-sveta}
    # ⚠️ Standart holda faqat LOKAL interfeys. Ilgari bu qator
    # `"${POSTGRES_PORT:-5432}:5432"` edi, ya'ni Docker port ni `0.0.0.0`
    # ga ochardi va baza (standart paroli bilan) butun internetdan
    # ko'rinardi. Tashqaridan ulanish kerak bo'lsa — SSH tunnel yoki
    # ataylab `POSTGRES_BIND=0.0.0.0` + kuchli parol.
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `-h 127.0.0.1` MAJBURIY — usiz birinchi ishga tushirish poygaga tushadi.
      # Postgres entrypoint i `initdb` va PostGIS init skriptlarini server
      # **faqat unix soketda** turgan holda bajaradi (`listen_addresses=''`).
      # Soket orqali `pg_isready` o'sha paytdayoq «accepting connections»
      # deydi → compose konteynerni `healthy` deb belgilaydi → `migrate`
      # ishga tushadi va **TCP** ga ulanib `Connection refused` oladi.
      # 56-runda serverda aynan shu yuz berdi (yangi volume, DB 10.1 s da
      # «healthy», `migrate` 12.5 s da yiqildi).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-sveta} -d ${POSTGRES_DB:-sveta}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sveta}:${POSTGRES_PASSWORD:-sveta}@db:5432/${POSTGRES_DB:-sveta}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sveta}:${POSTGRES_PASSWORD:-sveta}@db:5432/${POSTGRES_DB:-sveta}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Fon vazifalari — bir xil kod bazasi, alohida konteyner (05 §1).
  # `evaluate_outages` (E5), `build_map_snapshot` (E9), `process_outbox` (E13),
  # `refresh_coverage` (E14).
  # Usiz xarita bo'sh qoladi, bildirishnomalar umuman yuborilmaydi VA
  # `territory_stats` to'lmaydi (Coverage Index doim `unknown` bo'ladi),
  # shuning uchun prodda bu xizmat doim ishlashi kerak — `profiles: ["jobs"]`
  # ni olib tashlash odam qaroriga qoldirilgan (PROGRESS.md «Ochiq savollar»).
  jobs:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sveta}:${POSTGRES_PASSWORD:-sveta}@db:5432/${POSTGRES_DB:-sveta}
    command: ["python", "-m", "app.jobs.runner"]
    # Rasmning HEALTHCHECK i `curl /api/v1/health/live` qiladi, bu xizmat esa
    # HTTP server ko'tarmaydi — natijada konteyner DOIM `unhealthy` ko'rinadi
    # va haqiqiy nosozlik shu shovqin ichida yo'qoladi. Fon jarayonining
    # sog'lig'i boshqa joyda o'lchanadi: `05` §10 ning `job_last_run_age`
    # metrikasi va `ALERT_SNAPSHOT_AGE_S` ogohlantirishi.
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["jobs"]

  # Bot polling rejimida (E3). Prodda bot `api` protsessi ichida webhook
  # bilan ishlaydi (`05` §6.3), shuning uchun bu xizmat alohida profilda:
  # ikkalasi bir vaqtda ishga tushsa Telegram update larni bo'lib berardi.
  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sveta}:${POSTGRES_PASSWORD:-sveta}@db:5432/${POSTGRES_DB:-sveta}
      TELEGRAM_MODE: polling
    command: ["python", "-m", "app.bot"]
    # `jobs` bilan bir xil sabab: polling boti ham HTTP server emas.
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["bot"]

  # Veb-xarita (E9) — statik `web/` + API proksi bitta domenda.
  # `web/README.md`: CORS yoqilmagan, sahifa va API bir domendan berilishi
  # kerak — nginx `/api/` ni `api:8000` ga uzatadi. Buildsiz: `web/`
  # to'g'ridan-to'g'ri mount qilinadi (o'qish uchun).
  # Prod (bormitok.uz, HTTPS) uchun ustqurma:
  #   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml …
  # U `default.conf` nishonini `nginx.prod.conf` bilan almashtiradi va
  # certbot ni qo'shadi; proksi qoidalari ikkalasida ham bitta snippetdan.
  web:
    image: nginx:1.27-alpine
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./deploy/nginx.locations.conf:/etc/nginx/snippets/sveta-locations.conf:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
