# Sveta.Net veb-xaritasi — statik `web/` + API proksi (bitta domen).
#
# Nima uchun proksi: `web/README.md` — CORS yoqilmagan, sahifa va API
# bir domendan berilishi taxmin qilinadi. `window.SVETA_API_BASE`
# standart holda `/api/v1`, ya'ni shu server orqali `api:8000` ga boradi.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Statik fayllar (index.html, app.js, style.css)
    location / {
        try_files $uri $uri/ =404;
    }

    # Ommaviy API — FastAPI konteyneriga
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sog'liq tekshiruvi (deploy skripti ishlatadi)
    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }
}
