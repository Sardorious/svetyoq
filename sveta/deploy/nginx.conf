# Sveta.Net veb-xaritasi — lokal/HTTP konfiguratsiya (domensiz, port 8080).
#
# Prod uchun `nginx.prod.conf` ishlatiladi (bormitok.uz + HTTPS):
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d
# Ikkalasi ham proksi qoidalarini `nginx.locations.conf` dan oladi — bitta
# manba, ikki qobiq.

# `http` sathi: rate limit zonasi (qoidaning o'zi snippetda).
limit_req_zone $binary_remote_addr zone=sveta_api:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/sveta-locations.conf;
}
