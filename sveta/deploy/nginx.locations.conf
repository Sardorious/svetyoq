# Sveta.Net — proksi qoidalarining YAGONA manbai.
#
# Bu fayl `server { … }` blokining ichiga `include` qilinadi va ikkala
# konfiguratsiyaga ham bir xil ulanadi:
#   * `nginx.conf`      — lokal/HTTP (port 8080), domensiz;
#   * `nginx.prod.conf` — prod (bormitok.uz, HTTPS).
# Ikki nusxa saqlansa ular albatta ajralib ketardi: webhook faqat bittasiga
# qo'shilib qolar edi va bot prodda jimgina ishlamay turardi.
#
# ⚠️ `limit_req_zone` bu yerda EMAS — u `http` sathida e'lon qilinadi, ya'ni
# ulovchi fayllarning har birida (ikkalasi bir vaqtda yuklanmaydi).
#
# ⚠️ `api` — repodagi `docker-compose.yml` dagi xizmat nomi. Ko'p loyihali
# serverda xizmat `sveta-api` deb atalgan bo'lishi mumkin; o'shanda unga
# **tarmoq aliasi** beriladi (`aliases: [api]`), fayl esa o'zgarmaydi —
# `deploy-server/docker-compose.yml` ga qarang. Aliassiz nginx umuman
# ko'tarilmaydi: `host not found in upstream "api"`.

# --- Statik sahifa (index.html, app.js, style.css) ---
location / {
    try_files $uri $uri/ =404;
}

# --- Ommaviy API ---
# `web/README.md`: CORS yoqilmagan — sahifa va API bitta domendan beriladi.
# `window.SVETA_API_BASE` standart holda `/api/v1`.
location /api/ {
    # `01` §16 ning meros qilingan rate limit talabi ilovada bajarilmaydi
    # (PROGRESS «Ochiq savollar»: ilovada yoki proksida?). Shu yergacha —
    # eng arzon joyda: burst xaritani ochishdagi 4-5 parallel so'rovga yetadi.
    limit_req zone=sveta_api burst=40 nodelay;
    limit_req_status 429;

    proxy_pass http://api:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- Telegram webhook (`05` §6.3) ---
# Webhook rejimida bot `api` protsessining ichida yashaydi va yo'l API
# prefiksidan TASHQARIDA turadi (`TELEGRAM_WEBHOOK_PATH=/telegram/webhook`),
# ya'ni yuqoridagi `/api/` qoidasi uni qamramaydi — alohida joy kerak.
# Himoya: Telegram `X-Telegram-Bot-Api-Secret-Token` yuboradi, uni
# `app/bot/webhook.py` tekshiradi. Rate limit bu yerda YO'Q: Telegram
# retry qiladi va 429 update larning kechikishiga olib kelardi.
location /telegram/webhook {
    proxy_pass http://api:8000/telegram/webhook;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- Sog'liq tekshiruvi (deploy skripti ishlatadi) ---
# ⚠️ Ilovada ildiz sathidagi `/health` YO'Q — u `/api/v1/health` da
# (`app/api/router.py` `api_router` ni `settings.api_prefix` bilan ulaydi).
# Eski `proxy_pass http://api:8000/health` 404 qaytarardi.
location = /health {
    access_log off;
    proxy_pass http://api:8000/api/v1/health/live;
    proxy_set_header Host $host;
}
