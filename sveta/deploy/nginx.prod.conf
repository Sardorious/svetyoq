# Sveta.Net — prod konfiguratsiyasi: bormitok.uz, HTTPS (Let's Encrypt).
#
# ⚠️ QAYSI HOLATDA. Bu fayl TLS ni **konteynerda** tugatadi, ya'ni 80 va 443
# portlari bo'sh bo'lishi shart. Joriy serverda ular bo'sh EMAS: xostda
# nginx droneguard.uz va admin.droneguard.uz ni xizmat qilyapti. O'sha
# serverda ishlatiladigan yo'l — xost nginx sayti
# (`deploy-server/bormitok.uz.nginx.conf`) + `sveta-web` ning 127.0.0.1:8080
# i, ya'ni bu fayl ham, `docker-compose.prod.yml` ham, `scripts/init_tls.sh`
# ham O'SHA yerda ishlatilmaydi. Ular boshqa (bo'sh) serverga ko'chirish
# uchun saqlanadi.
#
# Ishlatilishi:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d
# Sertifikat birinchi marta `scripts/init_tls.sh` bilan olinadi (u avval
# vaqtinchalik o'z-o'zini imzolagan sertifikat qo'yadi, aks holda nginx
# `ssl_certificate` fayli yo'qligidan umuman ko'tarilmaydi).
#
# Domen shu yerda ATAYLAB qattiq yozilgan: u sir emas, o'zgarishi kamdan-kam
# va `envsubst` shablonlari `$uri`/`$host` kabi nginx o'zgaruvchilarini
# jimgina bo'shatib yuborish xavfini olib keladi.

limit_req_zone $binary_remote_addr zone=sveta_api:10m rate=10r/s;

# --- 80: ACME + HTTPS ga yo'naltirish ---
server {
    listen 80;
    server_name bormitok.uz www.bormitok.uz;

    # Let's Encrypt HTTP-01 tekshiruvi. Bu joy redirectdan OLDIN turishi
    # shart, aks holda certbot o'z faylini o'qiy olmaydi va sertifikat
    # yangilanmay qoladi (90 kundan keyin sayt o'chadi).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- 443: sahifa + API + webhook ---
server {
    listen 443 ssl;
    http2 on;
    server_name bormitok.uz www.bormitok.uz;

    ssl_certificate     /etc/letsencrypt/live/bormitok.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bormitok.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS. ⚠️ Brauzer buni eslab qoladi — HTTPS ishonchli turgandan keyin
    # yoqilsin; muddat ataylab qisqa (30 kun), `preload` yo'q.
    add_header Strict-Transport-Security "max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/sveta-locations.conf;
}
