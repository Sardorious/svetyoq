<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sveta.Net — проектная документация</title>
<style>
:root{
  --paper:#F6F8F7;
  --panel:#FFFFFF;
  --ink:#16232B;
  --ink-2:#41525E;
  --muted:#7B8B95;
  --rule:#DBE3E4;
  --line:#1B5E78;          /* структурный акцент: «кабель» */
  --line-soft:#CBDEE5;
  --pending:#D9822B;        /* статусы из легенды продукта */
  --confirmed:#C9403F;
  --external:#7458A6;
  --resolved:#2E8B62;
  --code-bg:#101C24;
  --code-ink:#D6E4EA;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --cond:"Helvetica Neue",Inter,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.62;-webkit-font-smoothing:antialiased;
}
a{color:var(--line);text-underline-offset:3px}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:296px minmax(0,1fr);min-height:100vh}

/* ---------- rail: одноline-диаграмма пакета ---------- */
.rail{
  position:sticky;top:0;height:100vh;overflow-y:auto;
  background:var(--panel);border-right:1px solid var(--rule);
  padding:26px 0 40px;
}
.brand{padding:0 22px 20px;border-bottom:1px solid var(--rule);margin-bottom:14px}
.brand h1{
  font-family:var(--cond);font-size:19px;line-height:1.15;margin:0 0 6px;
  letter-spacing:-.02em;font-weight:700;
}
.brand .sub{font-size:12px;color:var(--muted);letter-spacing:.02em}
.brand .meta{
  margin-top:12px;display:flex;gap:14px;font-family:var(--mono);
  font-size:11px;color:var(--ink-2);
}
.brand .meta b{font-weight:600;color:var(--ink)}

.filter{padding:0 22px 14px}
.filter input{
  width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:2px;
  background:var(--paper);font-family:var(--sans);font-size:13px;color:var(--ink);
}
.filter input:focus{outline:2px solid var(--line);outline-offset:1px;border-color:transparent}

.grp{margin:0 0 18px}
.grp-name{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);padding:0 22px 8px;
}
.rail ul{list-style:none;margin:0;padding:0}
.nav-item{
  width:100%;display:flex;align-items:center;gap:10px;
  padding:7px 22px 7px 22px;background:none;border:0;cursor:pointer;
  font-family:var(--sans);font-size:13.5px;color:var(--ink-2);text-align:left;
  position:relative;
}
/* вертикальная «линия» связи между узлами */
.nav-item::before{
  content:"";position:absolute;left:27px;top:0;bottom:0;width:1px;background:var(--line-soft);
}
.grp li:first-child .nav-item::before{top:50%}
.grp li:last-child  .nav-item::before{bottom:50%}
.node{
  width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line-soft);
  background:var(--panel);flex:0 0 auto;position:relative;z-index:1;
  transition:background .15s,border-color .15s,transform .15s;
}
.num{font-family:var(--mono);font-size:11px;color:var(--muted);flex:0 0 auto}
.ttl{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dg{
  font-family:var(--mono);font-size:10px;color:var(--line);
  border:1px solid var(--line-soft);border-radius:2px;padding:0 4px;flex:0 0 auto;
}
.nav-item:hover{color:var(--ink);background:#F1F5F5}
.nav-item:hover .node{border-color:var(--line)}
.nav-item.active{color:var(--ink);font-weight:600;background:#EDF3F4}
.nav-item.active .node{background:var(--line);border-color:var(--line);transform:scale(1.15)}
.nav-item:focus-visible{outline:2px solid var(--line);outline-offset:-2px}

/* ---------- content ---------- */
.main{padding:0 0 120px;min-width:0}
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(246,248,247,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:14px;padding:12px 40px;
}
.topbar .crumb{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.topbar .spacer{flex:1}
.btn{
  border:1px solid var(--rule);background:var(--panel);border-radius:2px;
  padding:5px 11px;font-size:12px;color:var(--ink-2);cursor:pointer;font-family:var(--sans);
}
.btn:hover{border-color:var(--line);color:var(--line)}
.menu-btn{display:none}

article{max-width:860px;padding:34px 40px 0;margin:0}

/* ---------- typography ---------- */
article h1{
  font-family:var(--cond);font-size:34px;line-height:1.12;letter-spacing:-.025em;
  font-weight:700;margin:0 0 28px;padding-bottom:18px;border-bottom:2px solid var(--ink);
}
article h2{
  font-family:var(--cond);font-size:22px;line-height:1.2;letter-spacing:-.015em;
  font-weight:700;margin:46px 0 14px;padding-top:16px;border-top:1px solid var(--rule);
}
article h3{font-size:16.5px;font-weight:700;margin:30px 0 10px;letter-spacing:-.005em}
article h4{font-size:14px;font-weight:700;margin:22px 0 8px;color:var(--ink-2);
  font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase}
article p{margin:0 0 15px}
article ul,article ol{margin:0 0 15px;padding-left:22px}
article li{margin:0 0 5px}
article hr{border:0;border-top:1px solid var(--rule);margin:38px 0}
article strong{font-weight:650}

/* callout — блоки замечаний C-01…C-12 и оговорок */
article blockquote{
  margin:20px 0;padding:14px 18px;background:#FFF;
  border:1px solid var(--rule);border-left:3px solid var(--pending);
  color:var(--ink-2);font-size:14.5px;border-radius:0 2px 2px 0;
}
article blockquote p:last-child{margin-bottom:0}
article blockquote strong{color:var(--ink)}

/* ---------- tables ---------- */
.tw{overflow-x:auto;margin:0 0 22px;border:1px solid var(--rule);background:#FFF}
article table{border-collapse:collapse;width:100%;font-size:13.5px}
article th{
  text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);font-weight:600;
  padding:10px 14px;border-bottom:1px solid var(--rule);white-space:nowrap;
  background:#FAFCFB;
}
article td{padding:9px 14px;border-bottom:1px solid #EDF1F1;vertical-align:top}
article tbody tr:last-child td{border-bottom:0}
article tbody tr:hover{background:#F7FAFA}

/* ---------- code ---------- */
article code{
  font-family:var(--mono);font-size:.875em;background:#EAF0F1;
  padding:1px 5px;border-radius:2px;color:#0E4356;
}
article pre{
  background:var(--code-bg);color:var(--code-ink);padding:18px 20px;
  overflow-x:auto;margin:0 0 22px;border-radius:2px;font-size:13px;line-height:1.55;
}
article pre code{background:none;color:inherit;padding:0;font-size:13px}

/* ---------- mermaid ---------- */
.fig{
  margin:0 0 26px;border:1px solid var(--rule);background:#FFF;border-radius:2px;overflow:hidden;
}
.fig-bar{
  display:flex;align-items:center;gap:10px;padding:8px 14px;
  border-bottom:1px solid var(--rule);background:#FAFCFB;
}
.fig-bar .lbl{
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
}
.fig-bar .spacer{flex:1}
.fig-body{padding:22px 18px;overflow-x:auto;text-align:center}
.fig-body svg{max-width:100%;height:auto}
.fig.zoom .fig-body{cursor:zoom-out}
.fig.zoom .fig-body svg{max-width:none;width:auto}
.fig-err{
  padding:14px 18px;font-family:var(--mono);font-size:12px;color:var(--confirmed);
  background:#FDF6F6;border-top:1px solid var(--rule);
}
.fig-err pre{background:none;color:var(--ink-2);padding:8px 0 0;margin:0;font-size:11.5px}

/* легенда статусов — из легенды карты продукта */
.legend{
  display:flex;flex-wrap:wrap;gap:16px;margin:0 40px 6px;padding:12px 16px;
  border:1px solid var(--rule);background:#FFF;font-size:12px;color:var(--ink-2);
  max-width:860px;
}
.legend b{font-weight:600;color:var(--ink)}
.sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:baseline}

.loading{padding:60px 40px;color:var(--muted);font-family:var(--mono);font-size:13px}

/* ---------- responsive ---------- */
@media (max-width:1000px){
  .shell{grid-template-columns:1fr}
  .rail{
    position:fixed;z-index:60;width:296px;left:0;top:0;
    transform:translateX(-100%);transition:transform .22s ease;
    box-shadow:0 0 0 100vmax rgba(22,35,43,0);pointer-events:none;
  }
  .rail.open{transform:translateX(0);pointer-events:auto;box-shadow:12px 0 40px rgba(22,35,43,.18)}
  .menu-btn{display:inline-block}
  .topbar{padding:12px 20px}
  article{padding:26px 20px 0}
  .legend{margin:0 20px 6px}
  article h1{font-size:27px}
  article h2{font-size:19px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
@media print{
  .rail,.topbar,.fig-bar,.legend{display:none}
  .shell{display:block}
  article{max-width:none;padding:0}
  .fig{border:0}
}
</style>

**Версия пакета:** 1.0
**Дата:** 2026-08-05
**Статус:** Draft for review
**Владелец:** Product / Architecture

## Состав пакета

## Критический разбор

Документ **21_Critical_Review.md** содержит разбор слабых мест самого пакета: какие числа выдуманы, какие выводы держатся на одном наблюдении, где требования противоречат друг другу и что нужно проверить до начала работ. Замечания имеют идентификаторы C-01…C-12 и продублированы пометками в тех разделах, к которым относятся. **Читать до принятия решений по пакету, а не после.**

## Методологическая рамка

- **AS-IS** — то, что подтверждено первоисточниками продукта (FAQ, «Статистика», интерфейс бота и карты). Помечено как `[AS-IS]`.
- **TO-BE** — проектируемое целевое состояние Enterprise-уровня. Помечено как `[TO-BE]`.
- **ASSUMPTION** — допущение, требующее подтверждения владельцем продукта. Помечено как `[ASSUMPTION]`.

> Разделение обязательно к соблюдению: текущий продукт — компактный краудсорсинговый сервис; целевая архитектура в этом пакете спроектирована с запасом и не описывает существующую реализацию. **Реалистичный плановый горизонт — 500 тыс. пользователей** (см. 04_NFR §нагрузка, замечание C-02); более высокие ступени приведены как теоретический предел, а не как план.

## Baseline-метрики (AS-IS, на момент фиксации)

| Метрика | Значение |
|---|---|
| Пользователей бота | 20 969 |
| Случаев за месяц (весь город) | 7 403 |
| Активных отключений за последние 3 ч | 76 |
| Медианная длительность | 44 мин |
| P90 длительности | 4 ч 11 мин |
| Сообщений на карте / подтверждённых | 79 / 64 |
| Записей из канала 1055 | 126 |
| Частота обновления карты | 60 с |
| TTL отметки | 3 ч от последнего сообщения |
| Радиус уведомлений | 500 м |
| Покрытие | 12 районов Ташкента + часть области |

## Соглашения

- Все времена — Asia/Tashkent (UTC+5), в API — UTC ISO-8601.
- Единая система координат — WGS 84 (EPSG:4326), хранение `geography(Point,4326)`.
- Термины: **Report** (сообщение пользователя) ≠ **Outage** (инцидент, кластер репортов).

# 01. Business Requirements Document (BRD)
**Продукт:** Sveta.Net — svetanet.uz / chiroqyoq.uz / @Sveta_netbot
**Версия:** 1.0 · **Стандарт:** BABOK v3, PMBOK 7

---

## 1. Executive Summary

Sveta.Net — независимая некоммерческая краудсорсинговая платформа мониторинга отключений электроэнергии в Ташкенте и части Ташкентской области. Жители сообщают об отключениях через Telegram-бот, система агрегирует сообщения в реальном времени и публикует карту, статистику и уведомления.

**Достигнутый результат [AS-IS]:** 20 969 пользователей бота, 7 403 зафиксированных случая за месяц, покрытие 12 районов города, обновление карты раз в минуту, узбекоязычное зеркало.

**Ключевая ценность:** за 10 секунд ответить жителю на вопрос «у меня одного нет света или у всего района» — от этого зависит, ждать восстановления или звонить в 1055 и вызывать электрика.

**Предмет данного BRD [TO-BE]:** перевод проекта из состояния «работающий MVP на энтузиазме» в состояние управляемой платформы: официальная интеграция с энергокомпанией, дедупликация сообщений в инциденты, интеллектуальная валидация, модерация, административная панель, аналитика и прогнозирование, масштабирование на регионы Узбекистана.

**Требуемые инвестиции (оценка):** 3 фазы, 12 месяцев, команда 6–9 FTE. Экономический эффект носит преимущественно общественный характер; коммерческая монетизация в текущем позиционировании исключена (см. §13, §17).

## 2. Business Problem

| ID | Проблема | Носитель проблемы | Следствие |
|---|---|---|---|
| BP-1 | Житель не знает, отключение локальное или массовое | Население | Потерянное время, лишние вызовы электрика, лишняя нагрузка на 1055 |
| BP-2 | Официальные каналы (группы 1055) публикуют разрозненно, без карты и без гарантии полноты | Население, СМИ | Нет единой картины |
| BP-3 | Нет верифицируемой статистики по районам | Аналитики, риелторы, журналисты, регулятор | Невозможно оценить надёжность сети района |
| BP-4 | Отсутствует проактивное оповещение — узнать об отключении дома, находясь на работе, нельзя | Удалённые работники, владельцы чувствительного оборудования | Порча продуктов, срыв работы, потеря данных |
| BP-5 | Краудсорсинговые данные без валидации подвержены шуму, дублям и злоупотреблениям | Платформа | Падение доверия к сервису |
| BP-6 | Энергокомпания не имеет обратной связи о реальной географии и длительности отключений | Оператор сети | Медленнее локализуются аварии |

**Формулировка проблемы (Problem Statement):**
> Жители Ташкента, столкнувшиеся с отключением электроэнергии, не имеют оперативного, географически точного и доступного источника информации о масштабе аварии, что приводит к потерям времени, лишним обращениям в аварийные службы и невозможности планировать день. Существующие официальные каналы не покрывают эту потребность в формате карты реального времени.

## 4. Future State (TO-BE)

### 4.1 Целевое видение

Платформа энергетической прозрачности Узбекистана: доверенный слой между населением и энергокомпанией, где сообщения жителей проходят интеллектуальную валидацию, сводятся в инциденты, обогащаются официальными данными по API и возвращаются обратно — жителю в виде уведомления и прогноза, оператору в виде тепловой карты аварий, регулятору в виде отчётности.

### 4.2 Ключевые изменения AS-IS → TO-BE

| Область | AS-IS | TO-BE |
|---|---|---|
| Единица учёта | Сырое сообщение | Инцидент (Outage) с кластеризацией репортов (DBSCAN по гео+времени) |
| Валидация | Порог «несколько сообщений» | Confidence Score 0–100: GPS, число независимых акторов, Trust Score, источник, история сети |
| Закрытие | Ручная кнопка + TTL 3 ч | Множественные сигналы: подтверждения возврата, данные оператора, ML-оценка |
| Источники | Telegram-бот + парсинг групп | + официальный API оператора, + импорт CSV/XLSX, + диспетчерские службы |
| Каналы | Telegram | + Web Push, + WebSocket, + SMS, + Email |
| Контроль качества | Нет | Модерация, очередь, аудит, анти-спам, анти-бот |
| Управление | Нет | Admin Panel, RBAC (11 ролей), Audit Log |
| Аналитика | Витрина статистики | + прогноз, + аномалии, + отчётность оператора, + экспорт |
| География | Ташкент + часть области | Республика Узбекистан |
| Плановые отключения | Нет | Отдельная сущность, календарь, заблаговременные уведомления |

## 9. Pain Points

> **Статус диагноза PP-1 (C-07).** Вывод опирается на единственное арифметическое совпадение:
> 55 + 4 + 3 + 2 + 1 + 1 + 10 = 76. Совпадение сильное и вряд ли случайно, но одно наблюдение не
> доказывает отсутствие дедупликации — возможно, в тот момент попросту не было сообщений, подлежащих
> объединению. Проверка дешёвая: повторить сверку в момент массовой аварии, когда из одного дома
> приходит несколько сообщений. Отдельное наблюдение — включение строки «Область и пригород» в общий
> счёт наряду с районами города — верно независимо от исхода проверки.


| ID | Боль | Кого касается | Тяжесть | Причина | Решение (ссылка) |
|---|---|---|---|---|---|
| PP-1 | «Активных сейчас» считает сырые сообщения, а не инциденты; 76 = сумма по районам, включая строку «Область и пригород», не являющуюся районом города | Все пользователи, аналитики | Критично | Нет дедупликации | FR-401, AI-DUP |
| PP-2 | Длительность завышена: считается по сообщениям жителей, «свет дают раньше, чем перестают писать» | Аналитики, риелторы | Высокая | Нет сигнала восстановления | FR-503, UC-3 |
| PP-3 | Кнопка «Свет вернулся» убирает только точку нажавшего | Пользователи | Средняя | Модель «точка = пользователь» | Переход к модели инцидента |
| PP-4 | Радиус подтверждения не документирован; «300 м» в СМИ не подтверждается первоисточником | Доверие, интеграторы | Средняя | Отсутствие спецификации | FR-402 |

## 14. ROI

> **Ограничение расчёта (C-04).** Расчёт ниже оперирует общественной ценностью — сэкономленным
> временем жителей и снижением нагрузки на службу 1055. Это корректный аргумент для гранта или
> институционального партнёрства, но он не порождает денежного потока и не покрывает счета за
> инфраструктуру. Продукт заявлен как некоммерческий, источник финансирования не определён.
> Пока ответа на вопрос о финансировании нет, целевая архитектура из документа 08 остаётся
> нереализуемой, а применимой является существенно более скромная конфигурация: монолит,
> один управляемый PostgreSQL, очередь на Redis вместо Kafka, без ML. Такая система обслуживает
> сотни тысяч пользователей силами одного-двух инженеров.


### 14.1 Модель социально-экономического эффекта

Проект некоммерческий: ROI считается как **Social Return on Investment (SROI)**.

**Допущения [ASSUMPTION]:**
- Активная база после Ph.3: 150 000 пользователей.
- Среднее число отключений на пользователя: 3 в месяц.
- Экономия времени на один эпизод: 20 мин (не ищет причину, не звонит электрику, планирует день).
- Оценка часа времени жителя: 25 000 UZS [ASSUMPTION].
- Доля предотвращённых лишних вызовов электрика: 8%, средняя стоимость вызова 150 000 UZS.

| Компонент эффекта | Расчёт | Годовой эффект |
|---|---|---|
| Экономия времени | 150 000 × 3 × 12 × (20/60 ч) × 25 000 | ≈ 45,0 млрд UZS |
| Предотвращённые вызовы электрика | 150 000 × 3 × 12 × 8% × 150 000 | ≈ 64,8 млрд UZS |
| Снижение нагрузки на 1055 (операционная экономия) | оценочно | ≈ 1,2 млрд UZS |
| Снижение порчи продуктов/оборудования (упреждение) | оценочно | ≈ 3,0 млрд UZS |

> Цифры носят иллюстративный характер и требуют валидации опросом пользователей. Порядок величины важнее точности: даже при десятикратно консервативных допущениях эффект многократно превышает затраты.

### 14.2 Затраты (12 мес, TO-BE)

| Статья | Оценка (USD/год) |
|---|---|
| Разработка (6–9 FTE, локальные ставки) | 180 000 – 260 000 |
| Инфраструктура (K8s, БД, CDN, мониторинг) | 18 000 – 45 000 |
| SMS-шлюз (опционально, при пиках) | 6 000 – 20 000 |
| Юридическое сопровождение, аудит безопасности | 12 000 |
| Прочее (домены, сертификаты, резерв 15%) | 30 000 |
| **Итого** | **246 000 – 367 000** |

### 14.3 Сценарии

| Сценарий | Условие | Вывод |
|---|---|---|
| Базовый | Гранты покрывают 70% затрат | Проект устойчив, Ph.3 достижима |
| Пессимистичный | Нет партнёрства с оператором + нет грантов | Заморозка на уровне Ph.1, поддержка силами волонтёров |
| Оптимистичный | Партнёрство + госзаказ на отчётность | Полное покрытие затрат, расширение на страну |

# 02. Product Requirements Document (PRD)
**Продукт:** Sveta.Net · **Версия:** 1.0 · **Статус:** Draft

---

## 1. Vision

> Ни один житель Узбекистана не должен сидеть в темноте, не понимая, что происходит и когда это закончится.

Sveta.Net превращает разрозненный опыт тысяч людей в общую, проверяемую картину состояния электроснабжения — доступную за один тап, на родном языке, бесплатно и без регистрации.

## 2. Mission

Собирать сообщения жителей об отключениях, валидировать их, сводить в достоверные инциденты и возвращать людям в виде карты реального времени, персональных уведомлений и честной статистики — оставаясь независимым, некоммерческим и прозрачным в методологии.

## 3. Product Goals

| ID | Цель | Метрика успеха | Горизонт |
|---|---|---|---|
| PG-1 | Ответ на вопрос «локально или массово» за ≤10 секунд | Time-to-answer p90 | Ph.1 |
| PG-2 | Достоверность: подтверждённое отключение действительно существует | Precision ≥95% | Ph.2 |
| PG-3 | Проактивность: житель узнаёт об отключении дома, не находясь дома | 35% подписок | Ph.2 |
| PG-4 | Честная статистика с раскрытием методологии и ограничений | 100% витрин с Coverage Index | Ph.1 |
| PG-5 | Доступность: любой язык, любое устройство, любая скорость | WCAG 2.1 AA, LCP ≤2.5 c на 3G | Ph.2 |
| PG-6 | Масштаб платформы: регионы и официальные источники | 5 регионов, 1+ интеграция | Ph.3 |

## 4. Product Strategy

### 4.1 Стратегические ставки

| Ставка | Суть | Почему |
|---|---|---|
| Telegram-first, не app-first | Основной вход — бот | Нулевое трение, аудитория уже там |
| Данные > фичи | Инвестировать в качество данных раньше, чем в новые экраны | Продукт живёт доверием |
| Прозрачность методологии как продукт | Публичные правила, Coverage Index, дисклеймеры | Отличие от «просто карты» |
| Кооперация, а не конфронтация с оператором | Слои разведены, не смешаны | Путь к легитимности |
| Некоммерческая нейтральность | Нет рекламы и продажи данных | Основа доверия |

### 4.2 Positioning Statement
Для **жителей Ташкента, столкнувшихся с отключением света**, которым нужно **немедленно понять масштаб проблемы**, Sveta.Net — это **краудсорсинговая карта отключений реального времени**, которая **за секунды показывает, есть ли авария у соседей**. В отличие от **официальных Telegram-групп и звонка в 1055**, наш продукт **даёт географию, историю и персональные уведомления**, оставаясь при этом **справочным, а не официальным источником**.

### 4.3 Moat
Сеть пользователей (20 969), исторический датасет отключений, доверие сообщества, двуязычие, репутация независимости.

## 6. User Personas

> **Статус персон (C-06).** Персоны ниже построены рассуждением, без интервью, опросов и аналитики
> поведения. Они выглядят непротиворечиво именно потому, что сконструированы такими; реальные
> пользователи такими не бывают. До проведения 8–12 интервью персоны следует читать как гипотезы
> о пользователях, а не как входные данные для приоритизации.


### P1 — Дилшод, 34, инженер, Чиланзар
Живёт в 9-этажке. Свет пропал вечером, в квартире темно, дети дома. **Цель:** за 10 секунд понять, ждать или искать электрика. **Барьеры:** не хочет регистрироваться, интернет мобильный. **Успех:** видит красное пятно на соседних домах — успокаивается, ждёт. **Цитата:** «Мне не нужен отчёт, мне нужно одно пятно на карте».

### P2 — Малика, 29, дизайнер на удалёнке, Мирзо-Улугбек
Работает из дома, дедлайны. **Цель:** узнать об отключении заранее или сразу, даже находясь в коворкинге. **Барьеры:** не знает, что подписка вообще существует (PP-6). **Успех:** приходит уведомление «отключение в 300 м от вашего адреса» — успевает сохранить работу и уехать.

### P3 — Азиз, 41, владелец кафе, Яккасарай
Холодильники с продуктами. **Цель:** оценить риск и длительность, решить, запускать ли генератор. **Успех:** видит «обычно 41 мин, долгие до 3 ч 57 мин» и принимает решение.

### P4 — Нигора, 52, узбекоязычная, Сергели
Пользуется телефоном базово. **Цель:** сообщить о проблеме на понятном языке. **Барьеры:** русский интерфейс. **Успех:** chiroqyoq.uz и `/language` в боте.

### P5 — Тимур, 30, журналист
**Цель:** сверить сообщения жителей с публикациями 1055, написать материал. **Успех:** переключает слои, видит расхождение географии, получает цифры с методологией.

### P6 — Камола, 38, риелтор
**Цель:** аргументировать клиенту качество района. **Барьер:** риск неверной интерпретации (PP-8). **Успех:** видит статистику + индекс покрытия + дисклеймер.

### P7 — Рустам, 45, диспетчер энергокомпании [TO-BE]
**Цель:** увидеть, где жители массово сообщают о проблемах раньше, чем поступят официальные заявки. **Успех:** операторская панель с тепловой картой и выгрузкой.

### P8 — Севара, 26, волонтёр-модератор [TO-BE]
**Цель:** быстро разобрать очередь спорных сообщений. **Успех:** очередь с приоритетом, горячие клавиши, ≤20 с на кейс.

## 12. User Stories + Acceptance Criteria

> Формат AC — Gherkin. Полный перечень FR — в `03_Functional_Requirements.md`.

### EP-01

**US-01.** Как житель без света, я хочу сообщить об отключении двумя тапами, чтобы быстро получить ответ.
```gherkin
Given я открыл @Sveta_netbot и у меня разрешена передача геолокации
When я нажимаю «⚠️ Сообщить об отключении» и подтверждаю отправку геолокации
Then бот определяет район автоматически
And на карте в течение 60 секунд появляется отметка со статусом «Ждёт подтверждения»
And бот отвечает вердиктом о масштабе (сколько сообщений рядом)
```

**US-02.** Как житель, отказавшийся делиться геолокацией, я хочу указать адрес вручную, чтобы всё равно сообщить о проблеме.
```gherkin
Given я отклонил запрос геолокации
When бот предлагает ввести улицу и номер дома
And я ввожу «Чиланзар, 12-квартал, дом 5»
Then система геокодирует адрес с точностью не хуже 150 м
And репорт создаётся с пометкой источника «адрес, введённый вручную»
And Confidence Score такого репорта ниже, чем у репорта с GPS
```

### EP-02

**US-03.** Как житель, я хочу отметить возвращение света, чтобы карта была честной.
```gherkin
Given у меня есть активный репорт
When я нажимаю «⚡ Свет вернулся»
Then моя точка удаляется с карты
And инцидент пересчитывает число активных подтверждений
And если активных подтверждений не осталось, инцидент переходит в RESOLVING
```

**US-04.** Как система, я закрываю инцидент автоматически, чтобы карта не показывала устаревшее.
```gherkin
Given по инциденту не поступало новых сообщений
When с момента последнего сообщения прошло 3 часа
Then инцидент помечается как завершённый
And в статистику записывается длительность с пометкой «верхняя оценка»
```

**US-05.** Как система, я спрашиваю пользователя о возвращении света, чтобы уточнить длительность.
```gherkin
Given прошло 45 минут с момента моего репорта и я не нажимал «Свет вернулся»
When наступает момент опроса
Then бот отправляет одно сообщение «Свет уже вернулся?» с кнопками Да/Нет
And повторный опрос не отправляется чаще одного раза в 60 минут
And суммарно не более 3 опросов на один репорт
```

### EP-03

**US-06.** Как житель, я хочу открыть карту одной командой, чтобы оценить обстановку.
```gherkin
Given я в чате с ботом
When я выполняю /map
Then я получаю кнопку перехода на карту реального времени
And карта открывается с центрированием на моей последней известной локации (если она была передана)
```

**US-07.** Как аналитик, я хочу переключать слои, чтобы сравнить источники.
```gherkin
Given я на карте
When я переключаю слой «🤖 Из бота» / «📡 Из 1055» / «🔥 Тепловая»
Then отображаются только объекты выбранного слоя
And источники не смешиваются в одном слое
And легенда отражает актуальный слой
```

**US-08.** Как житель, я хочу найти свой адрес на карте, чтобы не искать вручную.
```gherkin
Given я на карте
When я ввожу в поиск не менее 3 символов названия улицы
Then в течение 300 мс я вижу подсказки
And при выборе подсказки карта центрируется на адресе с zoom>=16
```

### EP-05

**US-09.** Как система, я подтверждаю аварию при нескольких независимых сообщениях, чтобы не публиковать ложное.
```gherkin
Given в радиусе R за окном T поступили репорты от N разных пользователей
When N >= порога подтверждения
Then инцидент получает статус «Авария подтверждена»
And визуализация меняется на сплошную заливку с ореолом
```

**US-10.** Как система, я подтверждаю аварию по данным энергокомпании независимо от числа жителей.
```gherkin
Given получено сообщение из мониторящегося канала энергокомпании
When сообщение сопоставлено с географией инцидента
Then инцидент подтверждается без требования нескольких сообщений жителей
And источник подтверждения фиксируется в карточке инцидента
```

**US-11.** Как модератор, я хочу разбирать спорные репорты, чтобы удерживать качество.
```gherkin
Given репорт получил Confidence Score ниже 30
When я открываю очередь модерации
Then репорт отображается с контекстом: гео, соседние репорты, история пользователя, причина попадания
And я могу «Подтвердить», «Отклонить», «Объединить с инцидентом», «Заблокировать источник»
And каждое действие фиксируется в аудит-логе с моим идентификатором и временем
```

### EP-06

**US-12.** Как житель, я хочу подписаться на уведомления по адресу, чтобы узнавать об отключениях удалённо.
```gherkin
Given я в боте
When я добавляю адрес в подписки
Then при появлении подтверждённого отключения в радиусе 500 м я получаю уведомление
And уведомление по одному инциденту приходит не более одного раза
And я могу отключить подписку в один тап
```

**US-13.** Как житель, я не хочу получать уведомления ночью, чтобы не просыпаться.
```gherkin
Given я включил тихие часы с 23:00 до 07:00
When в этот интервал появляется подтверждённое отключение рядом
Then уведомление откладывается до окончания тихих часов
And уведомления с приоритетом CRITICAL доставляются немедленно
```

### EP-04

**US-14.** Как риелтор, я хочу видеть статистику района с оговоркой о покрытии, чтобы не вводить клиента в заблуждение.
```gherkin
Given я выбрал район и период
When открывается витрина статистики
Then отображаются: число случаев, типичная длительность, длительность долгих отключений
And отображается индекс покрытия района
And присутствует дисклеймер о краудсорсинговой природе данных
```

### EP-07

**US-15.** Как узбекоязычный пользователь, я хочу полностью узбекский интерфейс.
```gherkin
Given я открываю chiroqyoq.uz или выполняю /language в боте
When я выбираю узбекский язык
Then весь интерфейс, уведомления и сообщения бота отображаются на узбекском
And выбор языка сохраняется между сессиями
```

## 20. Notification Logic

| Параметр | Значение |
|---|---|
| Триггер | Инцидент переходит в CONFIRMED (или PLANNED — за 24 ч и 1 ч до начала) |
| Геоусловие | ST_DWithin(подписка, инцидент, радиус) — по умолчанию 500 м, настраиваемо 250/500/1000/2000 м |
| Дедупликация | Один пользователь — одно уведомление на инцидент; повтор только при смене статуса |
| Приоритеты | LOW (плановое) / NORMAL (подтверждено рядом) / HIGH (массовая авария >50 репортов) / CRITICAL (аварийное оповещение) |
| Тихие часы | Настраиваемы; CRITICAL их игнорирует |
| Эскалация | Не доставлено в Telegram за 5 мин → Web Push → Email → (Ph.3) SMS |
| Rate limit | Не более 10 уведомлений в час на пользователя |
| Отписка | В один тап, ссылка в каждом уведомлении |

Подробно — `03_Functional_Requirements.md` §7 и `08_System_Architecture.md`.

## 21. Geo Logic

| Аспект | Решение |
|---|---|
| СК | WGS 84 (EPSG:4326), хранение `geography(Point,4326)` |
| Индекс | GiST по geom; кластеризация — DBSCAN (eps по метрам, min_samples по числу независимых акторов) |
| Привязка к району | ST_Contains по полигонам 12 районов Ташкента + «Область и пригород» как отдельная сущность (не район города) |
| Точность GPS | Учитывается: репорт с accuracy >500 м понижает вес |
| Приватность | Точка отображается со сдвигом/снапом к сетке ~50 м, чтобы не указывать на квартиру |
| Тепловая карта | Агрегация по H3 (разрешение 8–9) или гексагональной сетке |
| Радиус подтверждения | Параметр конфигурации, обязателен к публикации в методологии (закрывает PP-4) |

| ID | Требование |
|---|---|
| OFF-01 | PWA с Service Worker: последняя загруженная карта доступна офлайн с явной меткой «данные от HH:MM» |
| OFF-02 | Репорт, созданный офлайн, ставится в очередь и отправляется при восстановлении сети с сохранением исходного timestamp |
| OFF-03 | Офлайн-репорт помечается флагом `delayed=true` и не влияет на «активные сейчас», если задержка >30 мин |
| OFF-04 | Статистика и таймлайн кешируются на 24 ч |
| OFF-05 | Явный индикатор состояния сети в интерфейсе |

## 23. Search Logic

| ID | Требование |
|---|---|
| SRCH-01 | Поиск по улице, дому, району, ориентиру |
| SRCH-02 | Двуязычный индекс (ru/uz), нечувствительность к регистру и диакритике |
| SRCH-03 | Опечаткоустойчивость: trigram similarity (pg_trgm) + фонетическое соответствие |
| SRCH-04 | Ранжирование: точное совпадение → префикс → нечёткое; при равенстве — ближе к текущей геопозиции |
| SRCH-05 | Автодополнение от 3 символов, ≤10 подсказок, p95 ≤300 мс |
| SRCH-06 | История последних 5 запросов локально |
| SRCH-07 | Пустой результат предлагает «указать точку на карте» |

| ID | Требование |
|---|---|
| MAP-01 | Три слоя, взаимоисключающие по источнику: «Из бота», «Из 1055», «Тепловая» |
| MAP-02 | Визуализация статусов: пунктир (ждёт подтверждения), сплошная заливка с ореолом (подтверждено), отдельный цвет (из 1055), зелёный (завершённые, в ретроспективе) |
| MAP-03 | Кластеризация маркеров при zoom < 14 |
| MAP-04 | Автообновление данных без перезагрузки страницы |
| MAP-05 | Карточка инцидента по тапу: статус, число сообщений, время начала, источник, длительность |
| MAP-06 | Кнопка «Сообщить об отключении» на карте ведёт в бота (устраняет противоречие PP-5) |
| MAP-07 | Режим «Карта за период» для ретроспективы |
| MAP-08 | Ограничение числа отрисовываемых объектов через агрегацию на сервере (не более 2000 фич на ответ) |

## 25. Moderation Logic

| Аспект | Правило |
|---|---|
| Попадание в очередь | Confidence < 30; жалоба пользователя; срабатывание anti-fraud; аномалия объёма |
| Приоритет очереди | По числу потенциально затронутых пользователей × срочности |
| SLA | Разбор ≤15 мин в рабочее время, ≤2 ч ночью |
| Действия | Подтвердить / Отклонить / Объединить / Разделить / Заблокировать источник / Эскалировать |
| Аудит | Каждое действие — неизменяемая запись (кто, что, когда, до/после) |
| Апелляция | Пользователь может оспорить блокировку через `/support` |
| Метрики модератора | Кейсов/час, доля отменённых решений, среднее время разбора |

# M1. Идентификация и сессии

### FR-101 — Идентификация пользователя Telegram
| Поле | Значение |
|---|---|
| **Описание** | Система идентифицирует пользователя по `telegram_user_id`, полученному от Bot API, без сбора персональных данных. |
| **Предусловие** | Пользователь начал диалог с @Sveta_netbot. |
| **Основной сценарий** | 1. Bot API передаёт update с `from.id`. 2. Система ищет запись `telegram_users`. 3. При отсутствии — создаёт с псевдонимизированным идентификатором (HMAC от `telegram_user_id`). 4. Возвращает внутренний `user_id`. |
| **Альтернативный** | Пользователь ранее заблокирован → диалог продолжается, но репорты не публикуются (shadow-ban), см. FR-409. |
| **Ошибки** | `TG_UPDATE_INVALID` — некорректная подпись/структура; `USER_BLOCKED`. |
| **Бизнес-правило** | BR-10 (не хранить ПДн), BR-14 |
| **API** | внутренний `POST /internal/v1/identity/resolve` |
| **UI** | Отсутствует (прозрачно) |
| **Приоритет** | P0 `[AS-IS]` |
| **AC** | Given новый пользователь пишет боту, When приходит первый update, Then создаётся запись без хранения имени, username и телефона, And ФИО и номер телефона не сохраняются ни в одной таблице. |

### FR-102 — Веб-сессия анонимного посетителя
| Поле | Значение |
|---|---|
| **Описание** | Сайт доступен без регистрации; создаётся анонимная сессия для персонализации карты (последний центр, выбранный слой, язык). |
| **Предусловие** | Открыт svetanet.uz / chiroqyoq.uz |
| **Основной сценарий** | 1. Выдаётся анонимный `session_id` (cookie, SameSite=Lax, Secure, HttpOnly). 2. Настройки хранятся локально. |
| **Альтернативный** | Cookie заблокированы → работа в режиме без сохранения предпочтений. |
| **Ошибки** | `SESSION_CREATE_FAILED` |
| **Бизнес-правило** | BR-10 |
| **API** | `GET /api/v1/session` |
| **UI** | Нет видимого элемента |
| **Приоритет** | P1 `[AS-IS]` |
| **AC** | Given посетитель без cookie, When открывает карту, Then карта работает полностью, And персональные данные не запрашиваются. |

### FR-103 — Telegram Login на веб
| **Описание** | Возможность связать веб-сессию с аккаунтом Telegram для доступа к своим подпискам и репортам. |
|---|---|
| **Предусловие** | Пользователь нажал «Войти через Telegram» |
| **Основной сценарий** | 1. Telegram Login Widget → подписанный payload. 2. Бэкенд проверяет HMAC-SHA256 по токену бота и `auth_date` (≤300 с). 3. Выдаётся пара JWT (access 15 мин / refresh 30 дней). |
| **Альтернативный** | Пользователь отменяет вход → остаётся анонимным. |
| **Ошибки** | `AUTH_SIGNATURE_INVALID`, `AUTH_EXPIRED`, `AUTH_CANCELLED` |
| **Бизнес-правило** | BR-10 |
| **API** | `POST /api/v1/auth/telegram` |
| **UI** | Кнопка в шапке |
| **Приоритет** | P1 `[TO-BE]` |
| **AC** | Given просроченный `auth_date` (>300 c), When отправляется payload, Then возвращается 401 `AUTH_EXPIRED`, And сессия не создаётся. |

### FR-104 — Выдача и обновление JWT
| **Описание** | Access/Refresh токены с ротацией и отзывом. |
|---|---|
| **Основной сценарий** | 1. `POST /auth/refresh` с refresh-токеном. 2. Старый refresh инвалидируется (rotation). 3. Выдаётся новая пара. |
| **Альтернативный** | Обнаружено повторное использование отозванного refresh → вся цепочка сессий отзывается, инцидент безопасности. |
| **Ошибки** | `TOKEN_EXPIRED`, `TOKEN_REVOKED`, `TOKEN_REUSE_DETECTED` |
| **API** | `POST /api/v1/auth/refresh`, `POST /api/v1/auth/logout` |
| **Приоритет** | P0 `[TO-BE]` |
| **AC** | Given refresh-токен использован повторно, When приходит запрос, Then все активные сессии пользователя отзываются, And создаётся запись в audit_logs. |

### FR-105 — Вход администратора с 2FA
| **Описание** | Административный вход по email+пароль и TOTP. |
|---|---|
| **Предусловие** | Учётная запись создана Super Admin, 2FA настроена |
| **Основной сценарий** | 1. Ввод логина/пароля (Argon2id). 2. Запрос TOTP. 3. Проверка. 4. Выдача JWT с ролью. |
| **Альтернативный** | Потерян TOTP → восстановление по резервным кодам (10 одноразовых). |
| **Ошибки** | `INVALID_CREDENTIALS`, `MFA_REQUIRED`, `MFA_INVALID`, `ACCOUNT_LOCKED` |
| **Бизнес-правило** | Блокировка на 15 мин после 5 неудач |
| **API** | `POST /api/v1/admin/auth/login`, `/mfa/verify` |
| **UI** | Экран входа админ-панели |
| **Приоритет** | P0 `[TO-BE]` |
| **AC** | Given 5 неудачных попыток за 10 мин, When шестая попытка, Then 423 `ACCOUNT_LOCKED`, And уведомление Super Admin. |

### FR-106 — Управление ролями
| **Описание** | Назначение ролей из справочника RBAC (см. `07_RBAC.md`). |
|---|---|

# M4. Подтверждение и валидация

### FR-401 — Кластеризация репортов в инциденты
| **Описание** | Сведение сырых сообщений в инциденты; устраняет искажение метрики «Активных сейчас», которая в AS-IS равна сумме сырых сообщений (76 = 55+4+3+2+1+1+10, включая строку «Область и пригород», не являющуюся районом города). |
|---|---|
| **Предусловие** | Есть поток репортов с координатами и временем |
| **Основной сценарий** | 1. Онлайн-кластеризация DBSCAN (eps = радиус подтверждения, min_samples = порог). 2. Каждому кластеру соответствует инцидент. 3. Пересчёт при каждом новом репорте. |
| **Альтернативный** | Кластер разрастается и охватывает >2 районов → разделение на инциденты по административной границе с сохранением связи `parent_outage_id`. |
| **Ошибки** | `CLUSTERING_TIMEOUT` → репорт временно висит как самостоятельный инцидент, повторная обработка в фоне |
| **Бизнес-правило** | BR-13, BR-14 |
| **API** | `GET /api/v1/outages?status=active` (возвращает инциденты, не репорты) |
| **UI** | Дашборд: «Активных инцидентов» и отдельно «Сообщений» |
| **Приоритет** | P0 `[TO-BE]` |
| **AC** | Given 55 репортов в Яшнабаде в пределах одной подстанции, When вычисляются активные, Then показывается 1 инцидент с 55 сообщениями, And метрика «Активных инцидентов» не равна сумме сообщений, And «Область и пригород» отображается отдельно от 12 районов города. |

### FR-402 — Правило подтверждения аварии
| **Описание** | Инцидент получает статус «Авария подтверждена» при нескольких независимых сообщениях в одном районе **либо** при поступлении сообщения из мониторящихся каналов с информацией от энергокомпании. |
|---|---|
| **Предусловие** | Существует инцидент в статусе «Ждёт подтверждения» |
| **Основной сценарий** | 1. Подсчёт независимых акторов в радиусе R за окно T. 2. При достижении порога N — статус CONFIRMED. 3. Визуализация меняется на сплошную заливку с ореолом. |
| **Альтернативный** | Пришли данные энергокомпании → немедленное подтверждение вне зависимости от N. |
| **Ошибки** | — |
| **Бизнес-правило** | BR-03. Параметры R, T, N — конфигурируемые и **обязательные к публикации в разделе методологии**. Первоисточник формулирует условие как «несколько независимых пользователей в одном районе», без указания расстояния; значение «300 м» встречается в публикациях СМИ, но первоисточником не подтверждается. Радиус 500 м относится к уведомлениям и не должен использоваться как радиус подтверждения. Требуется явное решение владельца продукта. |
| **API** | `GET /api/v1/meta/validation-rules` |
| **UI** | Страница «Методология» |
| **Приоритет** | P0 `[AS-IS → уточнить]` |
| **AC** | Given N независимых пользователей сообщили в радиусе R за окно T, Then инцидент подтверждён; And значения R, T, N доступны публично через API и на странице методологии; And изменение параметров фиксируется в audit_logs. |

### FR-403 — Confidence Score
| **Описание** | Числовая оценка достоверности инцидента 0–100. |
|---|---|
| **Основной сценарий** | Скоринг по факторам: число независимых акторов, разнесённость точек, точность GPS, Trust Score авторов, наличие официального источника, историческая аварийность локации, согласованность времени. |
| **Альтернативный** | Недостаточно факторов → Score рассчитывается по доступным с понижающим коэффициентом неопределённости. |
| **Бизнес-правило** | <30 → очередь модерации; 30–69 → PENDING; ≥70 → CONFIRMED |
| **API** | поле `confidence` в `GET /outages/{id}` |
| **UI** | В карточке инцидента — качественная шкала («низкая/средняя/высокая уверенность»), не «сырое» число |
| **Приоритет** | P0 `[TO-BE]` |
| **AC** | Given инцидент с 1 репортом низкой точности от нового пользователя, Then confidence < 30, And инцидент попадает в очередь модерации, And на публичной карте отображается как «ждёт подтверждения», а не как авария. |

#### Модель скоринга

| Фактор | Вес | Диапазон |
|---|---|---|
| Число независимых акторов (log-шкала) | 0.30 | 0–30 |
| Trust Score авторов (среднее) | 0.15 | 0–15 |
| Точность GPS | 0.10 | 0–10 |
| Пространственная разнесённость репортов | 0.10 | 0–10 |
| Совпадение с официальным источником | 0.25 | 0 или 25 |
| Историческая аварийность локации | 0.05 | 0–5 |
| Согласованность временного окна | 0.05 | 0–5 |

## 3. Нагрузка и Capacity

### 3.1 Модель нагрузки

Допущения: 30% зарегистрированных активны в месяц; при массовой аварии до 8% активных пользователей обращаются к сервису в течение 15 минут; соотношение чтение/запись ≈ 40:1.

| Ступень | Пользователей | MAU | Пиковый RPS (чтение) | Пиковый RPS (запись) | Репортов/сутки | Уведомлений/пик |
|---|---|---|---|---|---|---|
| S0 (AS-IS) | 21 тыс | ~8 тыс | 40 | 3 | ~250 | ~1 тыс |
| S1 | 100 тыс | 30 тыс | 250 | 15 | 2 тыс | 8 тыс |
| S2 | 500 тыс | 150 тыс | 1 200 | 70 | 10 тыс | 40 тыс |
| S3 | 1 млн | 300 тыс | 2 500 | 150 | 20 тыс | 80 тыс |
| S4 | 5 млн | 1.5 млн | 12 000 | 700 | 100 тыс | 400 тыс |
| S5 | 10 млн | 3 млн | 25 000 | 1 500 | 200 тыс | 800 тыс |

> **Замечание после ревью (C-02).** Ступени S4–S5 не имеют основания в пределах исходной территории: население Ташкента — около 3 млн человек, и 10 млн пользователей достижимы только при выходе далеко за пределы Узбекистана, что не заявлено ни в одной цели продукта. Планировать под S4–S5 означает проектировать под сценарий, которого нет. **Реалистичный горизонт — S2 (500 тыс).** Ступени S4–S5 сохранены как теоретический предел архитектуры, а не как плановая нагрузка, и не должны влиять на выбор технологий и бюджет.

### 3.2 Архитектурные меры по ступеням

| Ступень | Меры |
|---|---|
| S1 | Кеш карты в Redis (TTL 30 с), CDN на статику, 2 реплики API, read-replica PostgreSQL |
| S2 | Очередь (Kafka/RabbitMQ) для репортов и уведомлений, вынос воркеров, тайл-кеш агрегатов |
| S3 | Шардирование Redis, партиционирование `reports` по месяцам, отдельный сервис нотификаций, HPA |
| S4 | Гео-шардирование БД по регионам, materialized views для витрин, ClickHouse для аналитики, edge-кеш агрегированных тайлов |
| S5 | Мульти-AZ активный-активный, CQRS-разделение, предагрегация всех витрин, отдельный кластер стриминга |

### 3.3 Требования по нагрузочному тестированию

| ID | Требование |
|---|---|
| NFR-L-01 | Нагрузочные тесты обязательны перед каждым мажорным релизом |
| NFR-L-02 | Сценарий «массовая авария»: рост трафика ×20 за 60 секунд — деградация допустима, отказ — нет |
| NFR-L-03 | Soak-тест 24 ч без роста потребления памяти более 5% |
| NFR-L-04 | Spike-тест: система восстанавливает нормальные p95 в течение 5 минут после спада |
| NFR-L-05 | Chaos-тест: отказ одной AZ не приводит к недоступности |

| A07 Identification/Auth Failures | 2FA для админов, ротация refresh-токенов, детект повторного использования, блокировка после 5 попыток |
| A08 Software/Data Integrity | Подписанные образы, проверка HMAC вебхуков Telegram и партнёров |
| A09 Logging/Monitoring Failures | §6, алерты на аномалии аутентификации |
| A10 SSRF | Allow-list исходящих адресов, запрет запросов в приватные подсети |

| NFR-G-05 | Полнотекстовый и trigram-поиск по адресам, p95 ≤300 мс при 500 тыс адресных объектов |
| NFR-G-06 | Отдельный поисковый индекс (OpenSearch) при S3+ |
| NFR-G-07 | Геоданные версионируются: изменение границ районов не искажает историческую статистику |

# 05. API Specification
**Стиль:** REST, JSON · **Версия API:** v1 · **Спецификация:** см. `17_OpenAPI.yaml`

## 1. Общие принципы

| Аспект | Решение |
|---|---|
| Base URL | `https://api.svetanet.uz/api/v1` |
| Публичный (open data) | `https://api.svetanet.uz/api/public/v1` |
| Формат | `application/json; charset=utf-8`, для гео — `application/geo+json` |
| Время | UTC, ISO-8601 (`2026-08-05T14:32:00Z`); клиент отображает в Asia/Tashkent |
| Координаты | WGS 84, порядок `[lon, lat]` в GeoJSON |
| Версионирование | В пути (`/v1`); ломающие изменения — только в новой мажорной версии |
| Идемпотентность | Заголовок `Idempotency-Key` для всех POST, создающих сущности |
| Трассировка | `X-Request-Id` в запросе и ответе; `traceparent` (W3C) |
| Язык | `Accept-Language: ru | uz` |
| Сжатие | gzip / brotli |

### Общие заголовки ответа

```
X-Request-Id: 7c1f...
X-RateLimit-Limit: 300
X-RateLimit-Remaining: 287
X-RateLimit-Reset: 1754400000
Cache-Control: public, max-age=30, stale-while-revalidate=60
```

## 2. Authorization

| Тип клиента | Механизм |
|---|---|
| Анонимный веб | Без токена, только чтение публичных ресурсов |
| Пользователь | JWT Bearer, получен через Telegram Login (`POST /auth/telegram`) |
| Бот (внутренний) | mTLS + service token |
| Админ | JWT Bearer с ролью, обязательный 2FA при выдаче |
| Партнёр (Open Data) | API-ключ в заголовке `X-Api-Key` + квоты |

```

```

**JWT claims:**
```json
{

  "roles": ["registered_user"],
  "scope": ["reports:write", "subscriptions:manage"],
  "iss": "https://api.svetanet.uz",
  "aud": "svetanet-web",
  "exp": 1754400900,
  "iat": 1754400000,
  "jti": "sess_01J8..."
}

**СУБД:** PostgreSQL 16 + PostGIS 3.4 · Расширения: `postgis`, `pg_trgm`, `uuid-ossp`, `pgcrypto`, `pg_stat_statements`

## 1. Принципы

| Принцип | Реализация |
|---|---|
| Нормализация | 3NF для операционных таблиц; денормализация только в витринах (`stat_*`) |
| Идентификаторы | ULID/UUID v7 (`id uuid`), сортируемые по времени |
| Приватность | Точные координаты — в `reports.geom_exact` с доступом только для роли `svetanet_internal`; публичные представления отдают `geom_public` (снап к сетке 50 м) |
| Время | `timestamptz`, хранение в UTC |
| Гео | `geography(Point,4326)` для точек, `geometry(MultiPolygon,4326)` для границ |
| Аудит | Append-only, запрет UPDATE/DELETE триггером |
| Партиционирование | `reports`, `notifications`, `audit_logs` — RANGE по месяцам |
| Мягкое удаление | `deleted_at` в справочниках; операционные записи не удаляются |

## 6. Примеры DDL

```sql
CREATE EXTENSION IF NOT EXISTS postgis;
CREATE EXTENSION IF NOT EXISTS pg_trgm;

CREATE TABLE outages (
    id                       uuid PRIMARY KEY DEFAULT gen_random_uuid(),
    type                     text NOT NULL DEFAULT 'emergency'
                             CHECK (type IN ('emergency','planned')),
    status                   text NOT NULL DEFAULT 'new'
                             CHECK (status IN ('new','pending','confirmed','resolving','resolved','expired','rejected')),
    layer                    text NOT NULL
                             CHECK (layer IN ('bot','official_1055','official_api')),
    district_id              uuid REFERENCES districts(id),
    centroid                 geography(Point,4326) NOT NULL,
    area                     geometry(Polygon,4326),
    reports_count            integer NOT NULL DEFAULT 0,
    independent_reporters    integer NOT NULL DEFAULT 0,
    confidence               smallint NOT NULL DEFAULT 0 CHECK (confidence BETWEEN 0 AND 100),
    confirmed_by             text[] NOT NULL DEFAULT '{}',
    parent_outage_id         uuid REFERENCES outages(id),
    planned_outage_id        uuid REFERENCES planned_outages(id),
    started_at               timestamptz NOT NULL,
    last_report_at           timestamptz NOT NULL,
    auto_close_at            timestamptz NOT NULL,
    resolved_at              timestamptz,
    duration_minutes         integer,
    duration_is_upper_bound  boolean NOT NULL DEFAULT true,
    created_at               timestamptz NOT NULL DEFAULT now(),
    updated_at               timestamptz NOT NULL DEFAULT now(),
    CONSTRAINT chk_time_order CHECK (last_report_at >= started_at)
);

CREATE INDEX idx_outages_centroid ON outages USING GIST (centroid);
CREATE INDEX idx_outages_autoclose ON outages (auto_close_at)
    WHERE status IN ('pending','confirmed');

-- TTL: автозакрытие через 3 часа после последнего сообщения (BR-05)
CREATE OR REPLACE FUNCTION set_auto_close() RETURNS trigger AS $$
BEGIN
    NEW.auto_close_at := NEW.last_report_at + interval '3 hours';
    RETURN NEW;
END; $$ LANGUAGE plpgsql;

CREATE TRIGGER trg_outages_autoclose
    BEFORE INSERT OR UPDATE OF last_report_at ON outages
    FOR EACH ROW EXECUTE FUNCTION set_auto_close();

-- Поиск адресатов уведомления в радиусе подписки (FR-701)
-- SELECT s.id, s.user_id
--   FROM subscriptions s
--  WHERE s.status = 'active'
--    AND ST_DWithin(s.geom, $1::geography, s.radius_m);
```

BEGIN

CREATE TRIGGER trg_audit_immutable
    BEFORE UPDATE OR DELETE ON audit_logs

# 07. RBAC — Роли и права доступа

## 1. Принципы

| Принцип | Реализация |
|---|---|
| Deny by default | Отсутствие явного разрешения = запрет |
| Least privilege | Минимально необходимый набор прав |
| Separation of duties | Модератор не меняет параметры валидации; аналитик не модерирует |
| Scoped roles | Региональные роли ограничены географией (`user_roles.scope_region_id`) |
| Accountability | Любое привилегированное действие → `audit_logs` |
| Break-glass | Экстренный доступ Super Admin с обязательным пост-разбором |

Модель: **RBAC + ABAC-ограничения** (регион, зона ответственности, владение ресурсом).

---

## 2. Роли

| Роль | Код | Назначение | 2FA | Скоуп |
|---|---|---|---|---|
| Super Admin | `super_admin` | Полный контроль, настройки валидации, роли | Обязательна | Глобальный |

## 7. Правила эскалации и разделения обязанностей

| Правило | Описание |
|---|---|
| SoD-1 | Изменение параметров валидации недоступно тем, кто модерирует по этим параметрам |
| SoD-2 | Автор действия не может утверждать собственную массовую рассылку |
| SoD-3 | Экспорт аудита — только Super Admin, при этом сам факт экспорта тоже логируется |
| SoD-4 | Роль Energy Company не имеет доступа к данным пользователей ни в каком виде |
| ESC-1 | Модератор эскалирует спорный кейс Super Admin; кейс получает приоритет urgent |
| ESC-2 | Инцидент безопасности (обнаружено переиспользование refresh-токена) → автоматический отзыв сессий + алерт |
| BG-1 | Break-glass доступ выдаётся на 60 минут, требует указания причины, автоматически отзывается, обязателен пост-разбор в течение 24 ч |

## 8. Жизненный цикл доступа

| Событие | Действие |
|---|---|
| Назначение роли | Аудит-запись, немедленное переиздание токенов, уведомление пользователя |
| Снятие роли | Немедленный отзыв активных сессий с этой ролью |
| Неактивность администратора 90 дней | Автоматическая деактивация учётной записи |
| Ротация паролей администраторов | Раз в 180 дней или при инциденте |
| Ревью прав | Ежеквартальный пересмотр всех административных ролей |
| Увольнение / выход волонтёра | Отзыв в тот же день, чек-лист офбординга |

## 9. Проверка доступа (псевдокод)

```text
authorize(actor, permission, resource):
    if actor.status != active: deny("USER_BLOCKED")
    if permission requires mfa and not actor.session.mfa_verified: deny("MFA_REQUIRED")
    if permission not in permissions_of(actor.roles): deny("FORBIDDEN")
    if permission is scoped:
        if resource.region_id not in actor.scope_regions: deny("FORBIDDEN")
    if permission is ownership-based:
        if resource.user_id != actor.id: deny("FORBIDDEN")
    if permission is privileged:
        audit(actor, permission, resource)
    allow()
```

Все отказы возвращают `403 FORBIDDEN` без раскрытия существования ресурса (для чувствительных сущностей — `404`).

# 08. System Architecture
**Модель:** C4 · **Нотация:** UML 2.5 / Mermaid

## 1. Архитектурные принципы

> **Предусловие применимости (C-04).** Описанная ниже архитектура предполагает постоянные расходы
> на инфраструктуру и команду от шести человек. Продукт заявлен как некоммерческий, источник
> финансирования не определён. Этот документ описывает целевое состояние **при условии решённого
> вопроса финансирования**. Если такого решения нет, применимой является редуцированная
> конфигурация: монолитное приложение с фоновыми задачами, один управляемый PostgreSQL с PostGIS,
> Redis в роли очереди вместо Kafka, отказ от ML-контура, наблюдаемость на управляемом сервисе.
> Она покрывает нагрузку до сотен тысяч пользователей и поддерживается одним-двумя инженерами.
> Выбирать полную конфигурацию, не ответив на вопрос о деньгах, — значит спроектировать систему,
> которую некому будет эксплуатировать.


| Принцип | Обоснование |
|---|---|
| Событийная обработка репортов | Пики нагрузки при массовых авариях; приём не должен блокироваться обработкой |
| Разделение чтения и записи | Чтение карты в 40 раз чаще записи |
| Кеш-первый рендеринг карты | Требование p95 ≤300 мс при 25 000 RPS |
| Внешние источники — через адаптеры | Отказ 1055/геокодера не влияет на доступность |
| Точные координаты изолированы | Приватность (BR-10, NFR-S-09) |
| Stateless-сервисы | Горизонтальное масштабирование |
| Конфигурация валидации — в рантайме | Пороги меняются без релиза, публикуются автоматически |

```mermaid

    cluster[Cluster Manager<br/>инкрементальный DBSCAN]
    scorer[Confidence Scorer<br/>факторная модель]
    trust[Trust Score Provider]

  fraud --> scorer

  cfg --> fsm

| Компонент | Ключевые решения |
|---|---|
| Geo Normalizer | Снап координат к сетке 50 м для публикации; определение района через ST_Contains; понижение веса при accuracy>500 м |
| Duplicate Detector | Ключ `(user_id, geohash7, окно 15 мин)` в Redis |
| Cluster Manager | Инкрементальный DBSCAN: новый репорт присоединяется к ближайшему кластеру в радиусе R, иначе создаёт новый |
| Confidence Scorer | Взвешенная модель (см. FR-403); официальный источник даёт немедленное подтверждение |
| Fraud Detector | Правила + ML-скоринг (см. `11_AI.md`) |
| State Machine | Единственное место смены статусов; все переходы логируются |
| Rules Config Provider | Читает `settings`, кеш 5 мин, изменения публикуются в `/meta/validation-rules` |

## 7. Sequence Diagrams (ключевые)

Полный набор — `19_Sequence_Diagram.md`. Основной поток:

```mermaid
sequenceDiagram
  actor U as Житель
  participant TG as Telegram
  participant B as Bot Service
  participant R as Report Service
  participant Q as Kafka
  participant V as Validation Engine
  participant DB as PostgreSQL
  participant N as Notification Service
  participant C as Redis/Cache

  U->>TG: «⚠️ Сообщить об отключении» + геолокация
  TG->>B: update
  B->>B: дедуп по update_id
  B->>R: POST /reports (Idempotency-Key)
  R->>DB: сохранить report
  R->>Q: report.created
  R-->>B: 201 + предварительный вердикт
  B-->>U: «Рядом сообщили N человек»
  Q->>V: report.created
  V->>V: нормализация, дедуп, кластеризация
  V->>DB: upsert outage, пересчёт confidence
  alt confidence >= 70
    V->>Q: outage.confirmed
    Q->>N: outage.confirmed
    N->>DB: ST_DWithin подписки в радиусе
    N->>N: дедуп, тихие часы, приоритет
    N->>TG: отправка уведомлений
  else confidence < 30
    V->>DB: создать moderation_case
  end
  V->>C: инвалидация кеша bbox
```

## 10. Отказоустойчивость и деградация

| Отказ | Поведение системы |
|---|---|
| PostgreSQL primary | Автоматический failover на реплику; запись недоступна ≤60 с; чтение с кеша |
| Redis | Прямые запросы в БД, повышение latency, алерт |
| Kafka | Report Service буферизует в БД (outbox), обработка после восстановления |
| Telegram API | Очередь исходящих накапливается, приём репортов продолжается |
| Источник 1055 | Слой «Из 1055» помечается устаревшим с меткой времени |
| Геокодер | Ручной выбор точки на карте |
| Validation Engine | Репорты копятся в очереди; карта показывает последний расчёт |
| Notification Service | Уведомления откладываются; при задержке >30 мин не отправляются как неактуальные |
| Полный отказ бэкенда | CDN отдаёт статический снапшот карты с явной меткой «данные от HH:MM» |

## 12. ADR (ключевые архитектурные решения)

| ADR | Решение | Обоснование | Альтернатива и почему отклонена |
|---|---|---|---|
| ADR-001 | Инцидент как первичная сущность, репорт — вторичная | Устраняет искажение метрик (PP-1) | Оставить точки — сохраняет проблему |
| ADR-002 | Асинхронная обработка через очередь | Пики ×20 при массовых авариях | Синхронная — риск отказа приёма |
| ADR-003 | PostGIS вместо специализированной гео-БД | Одна БД, зрелость, достаточная производительность | Отдельная гео-БД — избыточная сложность |
| ADR-004 | Разделение `geom_exact` / `geom_public` | Приватность (BR-10) | Единая колонка — риск раскрытия квартиры |
| ADR-005 | Параметры валидации в рантайм-конфиге | Настройка без релиза + публикация методологии | Хардкод — непрозрачно, PP-4 |
| ADR-006 | Telegram остаётся основным каналом, PWA — дополнением | Аудитория уже в Telegram | App-first — высокое трение |
| ADR-007 | Слои источников не смешиваются | Сохраняет верифицируемость (BR-08) | Единый поток — теряется UC-5 |
| ADR-008 | Кеш карты 30 с при обновлении раз в минуту | Соответствует AS-IS ожиданиям, снижает нагрузку | Realtime сразу — преждевременная сложность |

## 13. Notification Engine — детальная спецификация

### 13.1 Каналы

| Канал | Приоритет использования | Latency target | Ограничения |
|---|---|---|---|
| Telegram | Основной | p95 ≤20 с | Лимиты Bot API, блокировка ботом пользователем |
| Web Push | Второй (PWA) | p95 ≤30 с | Требует разрешения браузера, токены истекают |
| Email | Третий, дайджесты | p95 ≤5 мин | Требует подтверждённого адреса |
| SMS | Только CRITICAL (Ph.3) | p95 ≤60 с | Платно; хранение номера требует отдельного согласия |
| WebSocket | Realtime-обновление открытой карты | p95 ≤5 с | Только для активной сессии, не замена push |

### 13.2 Правила

| Правило | Значение |
|---|---|
| Триггер | `outage.confirmed`, `outage.resolved`, `planned.advance`, `broadcast` |
| Геоусловие | `ST_DWithin(subscription.geom, outage.centroid, subscription.radius_m)`, по умолчанию 500 м |
| Дедупликация | Уникальный ключ `(user_id, outage_id, event_type)`; повтор только при смене статуса |
| Тихие часы | Настраиваются пользователем; CRITICAL игнорирует |
| Rate limit | ≤10 уведомлений в час на пользователя, далее агрегация в сводное |
| Актуальность | Уведомление старше 30 минут от события не отправляется |
| Язык | По `users.locale` |
| Отписка | Кнопка в каждом уведомлении, действие в один тап |

### 13.3 Приоритеты

| Приоритет | Когда | Тихие часы | Эскалация |
|---|---|---|---|
| LOW | Плановое отключение за 24 ч | Соблюдаются | Нет |
| NORMAL | Подтверждённое отключение в радиусе | Соблюдаются | Telegram → Web Push |
| HIGH | Массовая авария (>50 независимых источников) | Соблюдаются | Telegram → Web Push → Email |
| CRITICAL | Ручное аварийное оповещение администратором | Игнорируются | Все каналы, включая SMS |

### 13.4 Escalation-логика

```mermaid
flowchart LR
  A[Событие] --> B{Канал 1: Telegram}
  B -- доставлено --> Z([Готово])
  B -- не доставлено 5 мин --> C{Канал 2: Web Push}
  C -- доставлено --> Z
  C -- нет токена / отказ --> D{Канал 3: Email}
  D -- доставлено --> Z
  D -- нет адреса --> E{Priority = CRITICAL?}
  E -- да --> F[SMS]
  E -- нет --> G([Отмечено как undeliverable])
```

### 13.5 Производительность

| Показатель | Требование |
|---|---|
| Поиск адресатов при 1 млн подписок | ≤200 мс (GiST + ST_DWithin) |
| Пропускная способность рассылки | ≥5 000 сообщений/мин при S3 |
| Пик рассылки | 800 000 сообщений при S5 — распределяется по приоритетам, батчами |
| Гарантия | At-least-once + дедупликация на уровне ключа |

## 2. Экраны

### 2.1 Дашборд

| Блок | Содержание | Обновление |
|---|---|---|
| Оперативная сводка | Активных инцидентов · Активных сообщений (раздельно!) · Подтверждённых за час · В очереди модерации | 30 с |
| Карта-мини | Тепловая карта последних 3 часов | 60 с |
| Состояние источников | 1055 (город), 1055 (область), API оператора, геокодер — healthy/degraded/down с временем последнего успеха | 60 с |
| Качество данных | Precision за 24 ч, доля отклонённых, доля дублей, медиана time-to-confirm | 5 мин |
| Очередь уведомлений | Лаг, отправлено/сбоев за час | 30 с |
| Топ районов сейчас | Список с числом инцидентов | 60 с |
| Алерты | Активные инциденты мониторинга | Realtime |

**Обязательное требование:** «Активных инцидентов» и «Активных сообщений» отображаются как две отдельные метрики с подписями — устраняет смешение, при котором значение равно сумме сырых сообщений по районам.

### 2.2 Карта оператора

| Возможность | Описание |
|---|---|
| Слои | Из бота · Из 1055 · Официальные · Тепловая · Плановые |
| Фильтры | Статус, confidence, район, период, тип, источник |
| Инструменты | Выделение области → массовые действия; линейка расстояний; экспорт видимой области |
| Режим сравнения | Два слоя рядом (split view) для верификации |
| Детали по клику | Полная карточка инцидента с репортами (обезличенными) |

### 2.3 Модерация

**Layout:** список слева (очередь), карточка справа, панель действий снизу.

| Элемент | Описание |
|---|---|
| Фильтры очереди | Приоритет, причина, район, возраст кейса |
| Сортировка | По приоритету → по числу затронутых пользователей → по возрасту |
| Карточка кейса | Причина попадания · Карта с репортами · Тайминг поступления · Профиль источников (возраст аккаунтов, Trust Score) · Соседние инциденты · История района |
| Действия | Подтвердить · Отклонить · Объединить · Разделить · Заблокировать источник · Эскалировать |
| Блокировка кейса | При открытии кейс блокируется за модератором на 5 минут; второй модератор видит режим только для чтения |
| Горячие клавиши | `C` подтвердить, `R` отклонить, `M` объединить, `E` эскалировать, `→` следующий |
| SLA-индикатор | Цветовая метка возраста кейса относительно SLA (15 мин / 2 ч ночью) |

**Целевое время разбора одного кейса — ≤20 секунд.**

### 2.4 Инциденты

| Колонка | Описание |
|---|---|
| ID, Статус, Тип, Слой | Основные атрибуты |
| Район | С фильтром |
| Сообщений / Уникальных | Две разные величины |
| Confidence | С цветовой шкалой |
| Начало / Последнее сообщение / Автозакрытие | Времена |
| Длительность | С пометкой «верхняя оценка» |

Действия: просмотр, закрытие, объединение, разделение, переоценка. Удаление подтверждённого инцидента запрещено (BR-15) — доступен только перевод статуса с указанием причины.

### 2.5 Плановые отключения

| Возможность | Описание |
|---|---|
| Календарь | Месяц / неделя, фильтр по району |
| Создание | Полигон на карте или выбор района, время начала и окончания, источник |
| Импорт | CSV/XLSX с графиком, предпросмотр и отчёт об ошибках построчно |
| Уведомления | Настройка заблаговременности (24 ч, 1 ч) |
| Связь с фактом | Список инцидентов, привязанных к плановому |

### 2.6 Пользователи

| Возможность | Описание |
|---|---|
| Поиск | По внутреннему ID (не по имени — персональные данные не хранятся) |
| Карточка | Trust Score, число репортов, доля подтверждённых, доля отклонённых, статус, блокировки |
| Действия | Блокировка (с причиной и сроком), shadow-ban, снятие блокировки, сброс Trust Score |

### 2.7 Аналитика

Дублирует публичные витрины плюс: сравнение источников, воронка подтверждений, Coverage Index по районам, производительность модераторов, тренды и прогноз. Экспорт в CSV/XLSX/PDF.

### 2.8 Уведомления

| Возможность | Описание |
|---|---|
| Мониторинг | Отправлено / доставлено / отклонено, по каналам |
| Ручная рассылка | Выбор области на карте → предпросмотр охвата → текст (ru/uz) → отправка |
| Двойное подтверждение | При охвате >5 000 адресатов требуется подтверждение вторым администратором |
| Шаблоны | Заготовки сообщений с плейсхолдерами |
| История рассылок | Кто, когда, кому, текст, результат |

### 2.9 Импорт / Экспорт

| Возможность | Описание |
|---|---|
| Импорт | CSV/XLSX: графики плановых, справочники улиц, полигоны (GeoJSON) |
| Валидация | Предпросмотр, построчный отчёт об ошибках, частичный импорт |
| Экспорт | Асинхронные задачи, статус, ссылка с TTL 24 ч |
| История | Все операции с автором и результатом |

### 2.10 Настройки

| Группа | Параметры |
|---|---|
| Валидация | Радиус подтверждения (R), временное окно (T), минимум независимых источников (N), пороги Confidence, TTL отметки (3 ч) |
| Уведомления | Радиус по умолчанию (500 м), лимиты, приоритеты, тихие часы по умолчанию |
| Источники | Список внешних источников, интервалы опроса, включение/отключение |
| Зоны покрытия | Активные регионы |
| Публикация | Какие параметры публикуются на странице методологии |

**Правило:** изменение параметров валидации доступно только Super Admin, фиксируется в аудите со значениями «до» и «после», и автоматически обновляет публичную страницу методологии и `GET /meta/validation-rules`.

### 2.11 Роли и права

Матрица «роль × разрешение» с чекбоксами (только просмотр для не-Super Admin), назначение ролей пользователям, ограничение скоупа по региону.

### 2.12 Аудит

| Фильтр | Значения |
|---|---|
| Актор | Пользователь |
| Действие | Тип операции |
| Сущность | Тип и ID |
| Период | Диапазон дат |

Отображение diff «до/после» в формате JSON. Экспорт — только Super Admin, сам факт экспорта логируется.

### 2.13 Логи и состояние

Health-статусы сервисов, лаги очередей, состояние реплик БД, последние ошибки, ссылки на Grafana и трассировки по `request_id`.

## 7. Coverage Index

> **Статус формулы (C-11).** Формула индекса и пороги отнесения района к низкому, среднему и высокому
> покрытию предложены умозрительно и не валидированы на данных. Задача поставлена верно: предупредить,
> что малое число инцидентов может отражать отсутствие участников, а не благополучие сети. Но
> непроверенная формула способна создать обратную проблему — район с реально хорошей сетью получит
> ярлык недостаточного покрытия, и корректные данные будут дискредитированы. До валидации индекс
> показывается как справочный сигнал, а не как основание не доверять цифрам.


Ключевая метрика, устраняющая систематическое искажение краудсорсинговых данных.

```
CoverageIndex(district) = w1 · norm(активных_пользователей / 1000 жителей)
                        + w2 · norm(доля_ночных_репортов)
                        + w3 · norm(плотность_репортов_на_км²)
                        + w4 · norm(совпадение_с_официальными_публикациями)
```

| Уровень | Диапазон | Отображение |
|---|---|---|
| Высокое | ≥0.70 | Показатели интерпретируемы напрямую |
| Среднее | 0.40–0.69 | Показатели с оговоркой |
| Низкое | <0.40 | Обязательное предупреждение: цифра может отражать охват сервиса, а не надёжность сети |

**Поправочный коэффициент по часам** для матрицы «Когда отключают»: репорты нормализуются на среднюю активность пользователей в этот час, что частично компенсирует ночной провал.

# 11. AI / ML и Smart Validation Logic

## Часть I. Smart Validation Logic

### 1. Задача

Превратить поток разрозненных сообщений жителей в достоверные инциденты, отделив реальные аварии от шума, дублей, ошибок и злонамеренной накрутки — при том, что в AS-IS подтверждение опирается на простое правило «несколько независимых сообщений в одном районе», параметры которого не документированы.

### 2. Сигналы

| Группа | Сигнал | Как используется |
|---|---|---|
| **GPS** | Точность (accuracy_m) | Вес репорта: accuracy >500 м → ×0.5, >1000 м → ×0.25 |
| GPS | Источник координат | gps ×1.0, map_pick ×0.8, manual_address ×0.6, parsed ×0.5 |
| GPS | Пространственная разнесённость репортов кластера | Репорты из разных точек надёжнее идентичных координат |
| **Количество** | Число независимых акторов | Основной фактор, log-шкала (насыщение) |
| Количество | Отношение уникальных к общему числу сообщений | Низкое отношение → признак дубля/накрутки |
| **Время** | Плотность поступления | Естественная авария даёт всплеск с характерной формой |
| Время | Согласованность окна | Репорты, разнесённые на часы, — разные события |
| Время | Час суток | Ночью порог подтверждения снижается (меньше активность) |
| **Источник** | Официальная публикация | Немедленное подтверждение независимо от числа жителей |
| Источник | Канал (бот / веб / импорт) | Разный базовый вес |
| **История** | Trust Score авторов | Средневзвешенный |
| История | Историческая аварийность локации | Район с частыми авариями — априорно выше вероятность |
| История | Возраст аккаунта источника | Новые аккаунты — пониженный вес |
| **ML** | Anomaly score | Отклонение паттерна от исторической нормы |
| ML | Fraud score | Вероятность координированной накрутки |

### 3. Confidence Score

> **Предупреждение о статусе весов (C-01).** Приведённые ниже веса не выведены из данных: они
> подобраны так, чтобы сумма равнялась единице, и отражают экспертное представление о значимости
> сигналов, а не результат обучения или калибровки. Использовать их как готовые значения нельзя.
> До появления размеченной выборки веса подлежат либо калибровке на исторических данных, либо
> явной фиксации как экспертной оценки с указанием автора и даты.

```
Confidence = 100 × Σ(wᵢ · fᵢ) , где Σwᵢ = 1

f₁ независимые акторы   w=0.30   f₁ = min(1, log(1+n)/log(1+N_sat)), N_sat = 8
f₂ официальный источник w=0.25   f₂ = 1 если есть, иначе 0
f₃ Trust Score авторов  w=0.15   f₃ = avg(trust)/100
f₄ точность GPS         w=0.10   f₄ = 1 − min(1, accuracy/1000)
f₅ разнесённость точек  w=0.10   f₅ = min(1, spread_m / 200)
f₆ история локации      w=0.05   f₆ = нормированная частота аварий
f₇ временная согласован.w=0.05   f₇ = 1 − нормированная дисперсия времени

Итог корректируется: Confidence ×= (1 − fraud_score)
```

| Диапазон | Статус | Действие |
|---|---|---|
| 0–29 | Низкая уверенность | Кейс в очередь модерации; на публичной карте — «ждёт подтверждения» |
| 30–69 | Средняя | PENDING, публикуется как «ждёт подтверждения» |
| 70–100 | Высокая | CONFIRMED, публикуется как «авария подтверждена» |

Пороги конфигурируемы и публикуются через `/meta/validation-rules`.

### 4. Trust Score

| Событие | Δ |
|---|---|
| Стартовое значение | 50 |
| Репорт вошёл в подтверждённый инцидент | +3 (до 100) |
| Репорт подтверждён официальным источником | +5 |
| Репорт отклонён модератором | −15 |
| Обнаружен дубль | −2 |
| Срабатывание анти-фрода | −30 |
| Отметка «Свет вернулся» в разумный срок | +2 |
| Неактивность 90 дней | затухание к 50 на 10% |

Score не отображается пользователю (исключает игру в накрутку рейтинга).

### 5. Duplicate Detection

| Тип дубля | Метод |
|---|---|
| Самодубль | Ключ `(user_id, geohash7, окно 15 мин)` в Redis |
| Пересылка/повтор текста при импорте | Хеш нормализованного текста источника |
| Один инцидент, описанный разными адресами | Пространственно-временная кластеризация |
| Одно устройство, несколько аккаунтов | Косвенные признаки (совпадение паттернов, идентичные координаты до 6 знаков) |

### 6. Fraud Detection / Anti-Bot / Anti-Spam

| Признак | Правило | Реакция |
|---|---|---|
| Всплеск новых аккаунтов | >70% репортов кластера от аккаунтов моложе 24 ч | Кейс urgent, инцидент не публикуется |
| Идентичные координаты | >5 репортов с совпадением до 6 знаков | Считать как один источник |
| Невозможное перемещение | >200 км/ч между репортами одного пользователя | Пометка, снижение Trust Score |
| Регулярные интервалы | Дисперсия интервалов близка к нулю | Признак автоматизации |
| Аномальный объём | >5σ от исторической нормы района | Алерт + кейс модерации |
| Отсутствие подтверждающего поведения | Ни один автор не отвечает на опрос «свет вернулся?» | Понижение confidence |
| Веб-репорт без авторизации | — | Обязательная CAPTCHA, пониженный вес |

**Принцип:** при срабатывании пользователь не информируется (shadow-режим), чтобы не подсказывать способ обхода.

### 7. False Positive Detection

| Проверка | Реакция |
|---|---|
| Инцидент подтверждён, но за 30 мин нет новых сообщений при исторически высокой активности района | Флаг `suspected_false_positive`, ревизия |
| Официальный источник опровергает | Автоматический перевод в REJECTED с записью в аудит |
| Массовые отметки «Свет вернулся» в первые 5 минут | Понижение confidence, возможно ложное срабатывание |

### 8. Логика подтверждения — схема

```mermaid
flowchart TD
  R[Новый репорт] --> N[Нормализация гео]
  N --> D{Дубль?}
  D -- да --> M[Продлить активность существующего]
  D -- нет --> C[Присоединить к кластеру / создать]
  C --> F[Fraud Detector]
  F --> S[Confidence Scorer]
  S --> T{Официальный источник?}
  T -- да --> CF[(CONFIRMED)]
  T -- нет --> TH{Score}
  TH -- ">=70" --> CF
  TH -- "30..69" --> PD[(PENDING)]
  TH -- "<30" --> MQ[Очередь модерации]
  MQ --> HUM{Решение модератора}
  HUM -- подтвердить --> CF
  HUM -- отклонить --> RJ[(REJECTED)]
```

### 9. Метрики качества валидации

| Метрика | Определение | Target |
|---|---|---|
| Precision (CONFIRMED) | TP / (TP + FP) | ≥95%* |
| Recall | Доля реальных аварий, обнаруженных сервисом (сверка с официальными данными) | ≥70% |
| FPR | FP / всего подтверждённых | ≤2% |
| Time-to-confirm | Медиана | ≤3 мин |
| Доля кейсов в модерации | От всех инцидентов | ≤10% |
| Доля дублей после дедупликации | — | ≤3% |

\* **Статус целевых значений (C-10).** Размеченной выборки достоверности сообщений в продукте не существует, поэтому проверить эти цифры сейчас не на чем. Корректный порядок: накопить размеченные случаи через ручную модерацию → построить правиловую базовую линию → измерить её качество → и только затем ставить цели для модели относительно базовой линии. До этого момента значения в таблице — ориентир желаемого уровня, а не обязательство.

### 11. AI-01 Определение ложных сообщений

| Аспект | Решение |
|---|---|
| Задача | P(репорт ложный) |
| Признаки | Возраст аккаунта, Trust Score, accuracy, время суток, плотность соседних репортов, история района, паттерн интервалов, совпадение с официальными данными |
| Модель | Gradient Boosting (LightGBM), интерпретируемая через SHAP |
| Разметка | Решения модераторов как ground truth + сверка с официальными публикациями |
| Целевая метрика | PR-AUC; при пороге — Precision ≥0.9 при Recall ≥0.6 |
| Интеграция | `fraud_score` как множитель Confidence |
| Human-in-the-loop | Модель не отклоняет автоматически, только направляет в модерацию |

### 12. AI-04 Парсинг публикаций 1055

| Шаг | Метод |
|---|---|
| Языковая нормализация | ru/uz, кириллица/латиница, унификация сокращений («ул.», «ко‘ch.», «мкр») |
| Извлечение сущностей | NER-модель на район, улицу, номера домов, диапазоны, время |
| Геокодирование | Сопоставление со справочником улиц, trigram-матчинг |
| Оценка уверенности | Ниже порога → ручной разбор |
| Выход | Записи слоя «Из 1055» со статусом «не подтверждено» |

Целевая метрика: F1 ≥0.90 по извлечению улиц, ≥0.85 по домам.

### 13. AI-06/07 Прогнозирование

| Модель | Признаки | Выход |
|---|---|---|
| Риск аварии по району на 24 ч | Час, день недели, сезон, температура и её прогноз, история района за 90 дней, плановые работы, текущая нагрузка | Категория риска низкий/средний/высокий + вероятность |
| Ожидаемая длительность инцидента | Район, время суток, масштаб кластера, тип, историческая медиана локации, наличие официального подтверждения | Диапазон (P25–P75) в минутах |

**Ограничения, обязательные к соблюдению:**
- Прогноз публикуется только с доверительным интервалом.
- Явная пометка: оценка на основе исторических данных, не официальная информация.
- При падении точности ниже порога прогноз автоматически скрывается.
- Прогноз не используется как основание для подтверждения инцидента.

### 14. AI-09 Суммаризация инцидентов

Вход: инцидент + обезличенные комментарии + официальные публикации.
Выход: 2–3 предложения на ru и uz для карточки инцидента, месячного отчёта и запросов СМИ.
Ограничение: LLM не имеет доступа к точным координатам и идентификаторам пользователей; выход проходит проверку на отсутствие персональных данных.

### 15. AI-10 Приоритизация очереди модерации

Ранжирование по ожидаемому ущербу от ошибки: (число потенциально затронутых пользователей) × (неопределённость модели) × (срочность). Цель — снизить среднее время реакции на действительно важные кейсы.

### 16. MLOps

| Аспект | Решение |
|---|---|
| Хранилище признаков | Feature store на основе PostgreSQL/ClickHouse |
| Обучение | Офлайн, воспроизводимые пайплайны, версионирование данных и моделей |
| Валидация | Временное разделение (не случайное), проверка на дрейф |
| Деплой | Shadow-режим → canary → полный выкат |
| Мониторинг | Дрейф признаков, дрейф качества, доля переопределений модератором |
| Откат | Мгновенный откат к предыдущей версии или к правиловой логике |
| Аудит | Каждое влияние модели на статус инцидента логируется |

### 17. Этические ограничения

| Принцип | Реализация |
|---|---|
| Человек принимает решения о санкциях | Модель не блокирует пользователей автоматически |
| Объяснимость | Для каждого решения доступны SHAP-объяснения модератору |
| Отсутствие дискриминации по географии | Модель не должна систематически занижать доверие к репортам из районов с низким покрытием — контроль fairness-метрик по районам |
| Приватность | Обучение на псевдонимизированных и агрегированных данных; точные координаты не покидают внутренний контур |
| Прозрачность | Факт использования ML в валидации публикуется на странице методологии |
| Право на пересмотр | Пользователь может оспорить блокировку через `/support` |

# 14. Test Cases
**Подход:** ISTQB · Уровни: Unit, Integration, System, E2E, Acceptance · Типы: функциональные, нефункциональные, security, a11y, локализация

## 1. Стратегия тестирования

| Уровень | Ответственный | Покрытие | Автоматизация |
|---|---|---|---|
| Unit | Разработчик | ≥70%, критичные модули ≥90% | 100% |
| Integration | Разработчик/QA | Все межсервисные контракты | 100% |
| System | QA | Все FR приоритета P0/P1 | ≥80% |
| E2E | QA | 12 ключевых пользовательских путей | ≥90% |
| Acceptance | PO | AC всех user stories релиза | Ручная приёмка |
| Performance | SRE | NFR §2, §3 | Регулярно, перед релизом |
| Security | Security | OWASP Top 10, пентест | SAST/DAST в CI |
| Accessibility | QA | WCAG 2.1 AA | axe-core в CI + ручная проверка |
| Localization | QA | Полнота ключей ru/uz | Автотест ключей |

**Definition of Done:** код + тесты + прохождение CI + ревью + обновление OpenAPI + запись в аудите изменений требований.
