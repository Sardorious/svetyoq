| E2E-02 | Массовая авария | 50 репортов за 5 мин → кластеризация → подтверждение → рассылка → автозакрытие |
| E2E-03 | Попытка накрутки | 20 фейковых репортов → анти-фрод → кейс модерации → отклонение → блокировка источника |
| E2E-04 | Подписка и уведомление | Подписка на адрес → авария рядом → уведомление → переход на карту → уведомление о восстановлении |
| E2E-05 | Официальное подтверждение | Публикация 1055 → парсинг → слой «Из 1055» → сопоставление → подтверждение инцидента |
| E2E-06 | Плановое отключение | Импорт графика → уведомление за 24 ч и 1 ч → репорты привязаны к плановому → не влияет на метрики аварийности |
| E2E-07 | Журналист сверяет источники | Открыть карту → переключить слои → открыть статистику → прочитать методологию → выгрузить данные |
| E2E-08 | Узбекоязычный путь | chiroqyoq.uz → `/language` uz → репорт → уведомление на узбекском |
| E2E-09 | Модерация спорного кейса | Низкий confidence → очередь → разбор → решение → аудит |
| E2E-10 | Смена параметров валидации | Super Admin меняет порог → аудит → публикация в методологии → изменение поведения подтверждений |
| E2E-11 | Деградация источника | Источник 1055 недоступен 2 ч → алерт → баннер на карте → сервис работает на данных бота |
| E2E-12 | Офлайн-репорт | Нет сети → репорт в очередь → сеть восстановлена → отправка с исходным временем |

## 3. Критический релиз v2.0.0 — план миграции

Переход от модели «точка = пользователь» к модели «инцидент = кластер репортов» затрагивает все метрики и все витрины. Требует особого протокола.

### Этапы

| Этап | Действие | Критерий перехода |
|---|---|---|
| 1. Подготовка | Развернуть новые таблицы параллельно, писать в обе модели (dual-write) | Расхождение записей = 0 за 7 дней |
| 2. Пересчёт истории | Прогнать кластеризацию на исторических данных в отдельной схеме | Агрегаты сверены; отклонение по числу случаев объяснимо и задокументировано |
| 3. Shadow-чтение | Новая модель считает метрики параллельно, но не публикуется | Сравнительный отчёт за 7 дней принят PO |
| 4. Canary | 10% трафика карты читает новую модель | Отсутствие роста ошибок и latency за 48 ч |
| 5. Полный выкат | 100% трафика | Мониторинг 72 ч в усиленном режиме |
| 6. Публичная коммуникация | Объяснить изменение цифр пользователям и СМИ | Опубликован пост о методологии |
| 7. Очистка | Отключить dual-write, архивировать старые витрины | Через 30 дней после выката |

### Коммуникация изменения метрик

> Обязательно: после выката число «активных отключений» существенно уменьшится, поскольку раньше показывалась сумма сырых сообщений, а теперь — число инцидентов. Без объяснения это выглядит как падение аварийности. Публикация методологического пояснения — часть релиза, а не последующая задача.

### План отката

| Условие отката | Действие |
|---|---|
| Рост ошибок API >2% | Переключение трафика на старую модель (feature flag), ≤5 мин |
| Расхождение метрик >10% необъяснимо | Откат чтения, сохранение dual-write, расследование |
| Деградация latency p95 >2× | Откат canary |

## 4. Чек-лист релиза

### Pre-release
- [ ] Все задачи релиза соответствуют DoD
- [ ] Регрессионный набор пройден на stage
- [ ] Нагрузочный тест (для мажорных релизов)
- [ ] SAST/DAST без High/Critical
- [ ] Миграции проверены и обратимы
- [ ] OpenAPI обновлён и опубликован
- [ ] Локализация ru/uz полная
- [ ] Release notes подготовлены (внутренние и публичные)
- [ ] План отката задокументирован
- [ ] Дежурный назначен

### Release
- [ ] Бэкап БД перед миграцией
- [ ] Выкат по стратегии (Blue-Green / Canary)
- [ ] Smoke-тесты на проде
- [ ] Проверка ключевых метрик в течение 30 мин

### Post-release
- [ ] Мониторинг 24 ч (72 ч для мажорных)
- [ ] Сверка бизнес-метрик с ожиданиями
- [ ] Публикация изменений пользователям (при изменении поведения или цифр)
- [ ] Обновление методологии (при изменении правил валидации)
- [ ] Ретроспектива релиза

## 5. Среды

| Среда | Назначение | Данные | Кто выкатывает |
|---|---|---|---|
| dev | Разработка | Синтетические | Автоматически при пуше |
| stage | Приёмка, нагрузка, демо | Обезличенная копия | Автоматически из `main` |
| prod | Продакшн | Реальные | Ручное подтверждение релиз-менеджера |

## 6. Метрики релизного процесса (DORA)

| Метрика | Baseline | Target Ph.2 |
|---|---|---|
| Deployment Frequency | По необходимости | ≥1/неделю |
| Lead Time for Changes | н/д | ≤3 дня |
| Change Failure Rate | н/д | ≤10% |
| MTTR | н/д | ≤1 ч |

## 7. Коммуникационный план релиза

| Аудитория | Канал | Что сообщается |
|---|---|---|
| Пользователи | Сообщение бота, баннер на сайте | Только изменения, влияющие на поведение или на понимание цифр |
| Журналисты и аналитики | Страница методологии, changelog | Изменения правил валидации, методики расчёта |
| Партнёры (API) | Email + changelog API | Изменения контрактов за 30 дней до вступления в силу |
| Команда | Внутренний канал | Все релизы |
| Спонсор | Ежемесячный отчёт | Прогресс по фазам, риски |

              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':

        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'

        '200':

            application/json:

                comment: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Решение применено и записано в аудит

            application/json:
              schema: { $ref: '#/components/schemas/ModerationCase' }

  /admin/settings:
    get:
      tags: [Admin]
      summary: Параметры системы
      operationId: getSettings
      security: [{ bearerAuth: [] }]

        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    patch:
      tags: [Admin]
      summary: Изменить параметры

      operationId: updateSettings
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Применено
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/audit-logs:
    get:
      tags: [Admin]
      summary: Журнал аудита
      operationId: listAuditLogs
      security: [{ bearerAuth: [] }]
      parameters:
        - name: actor_id
          in: query
          schema: { type: string, format: uuid }
        - name: entity_type
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'

        '200':
          description: Успешно

                type: object
                properties:
                  data:
                    type: array

  /exports:
    post:

        '202':

            application/json:

  /exports/{exportId}:
    get:

      responses:
        '200':
          description: Успешно

            application/json:

  /integration/outages:

  /public/outages.geojson:

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  headers:
    RateLimitRemaining:
      description: Остаток запросов в текущем окне
      schema: { type: integer }

  parameters:
    OutageId:
      name: outageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CaseId:
      name: caseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DistrictId:
      name: district_id
      in: query
      schema: { type: integer }
    Status:
      name: status
      in: query
      schema: { type: string, enum: [pending, confirmed, resolved, rejected] }
    Source:
      name: source
      in: query
      description: Фильтр по происхождению данных
      schema: { type: string, enum: [crowd, official, mixed] }
    Period:
      name: period
      in: query
      schema: { type: string, enum: [week, month, quarter, year], default: month }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Unauthorized:
      description: Не аутентифицирован
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Forbidden:
      description: Недостаточно прав
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NotFound:
      description: Не найдено
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    UnprocessableEntity:
      description: Семантически некорректные данные
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    TooManyRequests:
      description: Превышен лимит запросов
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }

  schemas:

    ProblemDetails:
      type: object
      description: RFC 9457
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, example: "https://api.svetanet.uz/problems/rate-limit" }
        title: { type: string, example: "Превышен лимит запросов" }
        status: { type: integer, example: 429 }
        detail: { type: string }
        instance: { type: string }
        trace_id: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    Point:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, const: Point }
        coordinates:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: number }
          description: "[долгота, широта]"

    District:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        name_uz: { type: string }
        is_city_district:
          type: boolean
          description: Территории вне города не входят в городские агрегаты.
        population: { type: integer, nullable: true }

    Outage:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, confirmed, resolved, rejected] }
        confidence_score: { type: integer, minimum: 0, maximum: 100 }
        district: { $ref: '#/components/schemas/District' }
        centroid: { $ref: '#/components/schemas/Point' }
        reports_count: { type: integer }
        distinct_reporters: { type: integer }
        source_mix: { type: string, enum: [crowd, official, mixed] }
        started_at: { type: string, format: date-time }
        last_report_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        resolution_type:
          type: string
          nullable: true
          enum: [user_confirmed, timeout, operator_confirmed, moderator]
          description: |
            При значении timeout длительность является верхней оценкой: восстановление
            произошло не позже последнего сообщения, но, как правило, раньше.

    OutageDetail:
      allOf:
        - $ref: '#/components/schemas/Outage'

            duration_is_estimate: { type: boolean }
            confidence_factors:
              type: object
              additionalProperties: { type: number }
            planned_outage_id: { type: string, format: uuid, nullable: true }

    OutageList:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Outage' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    PageMeta:
      type: object

        total: { type: integer, nullable: true }

    ReportCreate:

        lon: { type: number, minimum: -180, maximum: 180 }

        channel: { type: string, enum: [telegram, web, pwa] }

    ReportCreated:

        outage_status: { type: string }

    Report:
      type: object
      properties:
        id: { type: string, format: uuid }
        outage_id: { type: string, format: uuid }
        location: { $ref: '#/components/schemas/Point' }
        location_precision:
          type: string
          enum: [exact, approximate]
        channel: { type: string }
        source: { type: string, enum: [crowd, official] }
        reported_at: { type: string, format: date-time }

    ReportList:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Report' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    RestorationResult:
      type: object
      properties:
        outage_id: { type: string, format: uuid }
        outage_status: { type: string }
        restored_share: { type: number, description: Доля сообщивших о восстановлении }
        closed: { type: boolean }

    SubscriptionCreate:
      type: object
      required: [lat, lon]
      properties:
        label: { type: string, maxLength: 60 }
        lat: { type: number }
        lon: { type: number }
        radius_m: { type: integer, minimum: 100, maximum: 5000, default: 500 }
        planned_enabled: { type: boolean, default: true }
        quiet_hours_enabled: { type: boolean, default: false }
        quiet_from: { type: string, examples: ["23:00"] }
        quiet_to: { type: string, examples: ["07:00"] }

    SubscriptionUpdate:
      type: object
      properties:
        label: { type: string }
        radius_m: { type: integer, minimum: 100, maximum: 5000 }
        planned_enabled: { type: boolean }
        quiet_hours_enabled: { type: boolean }
        is_active: { type: boolean }

    Subscription:
      allOf:
        - $ref: '#/components/schemas/SubscriptionUpdate'

          properties:
            id: { type: string, format: uuid }

    StatSummary:
      type: object

          description: Число инцидентов — основная величина для сравнения периодов.
        reports_count:
          type: integer
          description: Число сообщений. Не является числом отключений.
        active_outages_now: { type: integer }
        median_duration_min: { type: integer }
        p90_duration_min: { type: integer }
        duration_is_upper_bound: { type: boolean, const: true }
        coverage_index: { type: number }
        methodology_url: { type: string, format: uri }

    DistrictStatList:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              district: { $ref: '#/components/schemas/District' }
              outages_count: { type: integer }
              reports_count: { type: integer }
              median_duration_min: { type: integer }
              p90_duration_min: { type: integer }

      type: object

        cells:
          type: array
          items:
            type: object
            properties:
              weekday: { type: integer, minimum: 0, maximum: 6 }
              hour: { type: integer, minimum: 0, maximum: 23 }
              outages_count: { type: integer }
              normalized_intensity: { type: number }
              is_low_activity_window:
                type: boolean
                description: Ночные часы, когда снижение может отражать сон пользователей, а не отсутствие отключений.

    CoverageList:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              district_id: { type: integer }
              coverage_index: { type: number }
              active_reporters_30d: { type: integer }
              level: { type: string, enum: [low, medium, high] }

    AddressSuggestion:
      type: object
      properties:

        location: { $ref: '#/components/schemas/Point' }
        score: { type: number }

    PlannedOutage:
      type: object

        notification_radius_default_m: { type: integer }
        duration_is_upper_bound: { type: boolean }
        effective_from: { type: string, format: date-time }
        version: { type: integer }

    TokenPair:
      type: object

        roles:

          items: { type: string }

      type: object
      properties:

      type: object
      properties:

          type: string
          enum: [low_confidence, suspected_fraud, conflicting_sources, parse_failed, user_flag]
        priority: { type: integer, minimum: 1, maximum: 5 }
        status: { type: string, enum: [open, claimed, resolved] }

        decision: { type: string, nullable: true }
        claimed_at: { type: string, format: date-time, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }

      type: object
      properties:
        id: { type: integer }

    ExportJob:
      type: object

        streets:

  examples: {}

# 18. ERD — Entity Relationship Diagram

**Нотация:** Information Engineering (crow's foot), Mermaid `erDiagram`.
**Источник схемы:** `06_Database.md`. Данный документ — визуальное и семантическое представление той же модели.

## 1. Обозначения кардинальности

| Символ | Значение |
|---|---|
| `||--o{` | Один ко многим, обязательный слева, опциональный справа |
| `||--||` | Один к одному |
| `}o--o{` | Многие ко многим (через связующую таблицу) |
| `||--|{` | Один ко многим, минимум один справа |

---

## 2. Домен Identity & Access

```mermaid
erDiagram
    users ||--o| telegram_users : "имеет привязку"
    users ||--o{ sessions : "открывает"
    users ||--o{ user_roles : "получает"
    roles ||--o{ user_roles : "назначается"
    roles ||--o{ role_permissions : "включает"
    permissions ||--o{ role_permissions : "входит в"
    users ||--o| admin_accounts : "расширяется"

    users {
        uuid id PK
        varchar external_ref UK
        varchar locale
        smallint trust_score
        timestamptz created_at
        timestamptz last_seen_at
        boolean is_blocked
    }
    telegram_users {
        uuid id PK
        uuid user_id FK
        bigint telegram_id UK
        varchar language_code
        boolean notifications_enabled
        timestamptz linked_at
    }

| Связь | Карт. | Смысл |

## 8. Нормализация и осознанные денормализации

Схема приведена к 3НФ. Отступления сделаны сознательно и перечислены явно:

| Поле | Тип отступления | Обоснование |
|---|---|---|
| `outages.reports_count`, `distinct_reporters` | Производный атрибут | Пересчёт при каждом чтении карты недопустим по latency; поддерживается триггером, сверяется ночным джобом |
| `outages.centroid`, `hull` | Производная геометрия | Вычисление на лету по всем репортам кластера слишком дорого для карты, обновляемой раз в минуту |
| `addresses.normalized` | Вычисляемое поле | Нужен уникальный индекс для дедупликации адресов |
| `stat_*` | Полные витрины | Аналитические запросы по годовой истории неприемлемы онлайн |
| `reports.geom_public` | Дубль geom_exact в огрублённом виде | Огрубление на лету рискует утечкой при ошибке в коде; безопаснее хранить раздельно |

**Инвариант целостности, проверяемый ночным заданием:** для каждого `outage` значения `reports_count` и `distinct_reporters` должны совпадать с фактическим подсчётом по `reports`. Расхождение — алерт, а не тихое исправление.

# 19. Sequence Diagrams

Набор UML-диаграмм последовательности для ключевых сценариев. Нотация — Mermaid `sequenceDiagram`. Каждая диаграмма привязана к функциональным требованиям из `03_Functional_Requirements.md`.

---

## SD-01. Создание репорта и формирование инцидента

**FR:** FR-301, FR-302, FR-401, FR-402 · **TC:** TC-050, TC-060

```mermaid
sequenceDiagram
    autonumber
    actor U as Житель
    participant TG as Telegram
    participant BOT as Bot Service
    participant API as Report API
    participant VAL as Validation Engine
    participant GEO as Geo Service
    participant DB as PostgreSQL/PostGIS
    participant K as Kafka
    participant MAP as Map Service

    U->>TG: «⚠️ Сообщить об отключении»
    TG->>BOT: update: location
    BOT->>BOT: проверка rate limit по telegram_id
    alt лимит превышен
        BOT-->>U: «Вы уже сообщали недавно»
    else в пределах лимита
        BOT->>API: POST /v1/reports (Idempotency-Key)
        API->>DB: SELECT по idempotency_key
        alt ключ найден
            DB-->>API: существующий report
            API-->>BOT: 200 OK (тот же id)
        else новый репорт
            API->>GEO: определить district, ближайший адрес
            GEO-->>API: district_id, address_id
            API->>VAL: оценить репорт
            VAL->>DB: история пользователя, trust_score
            VAL->>VAL: fraud_score, проверка дубля
            alt fraud_score выше порога
                VAL-->>API: shadow (публиковать только автору)
            else норма
                VAL->>DB: поиск кластера в радиусе R за окно T
                alt кластер найден
                    DB-->>VAL: outage_id
                    VAL->>DB: привязать report, пересчитать Confidence
                else кластера нет
                    VAL->>DB: создать outage (status=pending)
                end
            end
            API->>DB: INSERT report (geom_exact, geom_public)
            API->>K: publish report.created
            API-->>BOT: 201 Created
            BOT-->>U: «Принято. Отметка на карте»
        end
    end
    K->>MAP: consume report.created
    MAP->>MAP: инвалидация тайлов района
    K->>VAL: пересчёт статуса инцидента
    alt Confidence ≥ порога подтверждения
        VAL->>DB: outage.status = confirmed
        VAL->>K: publish outage.confirmed
    end
```

**Существенное отличие от AS-IS:** сообщение пользователя больше не является самостоятельной точкой на карте. Оно становится частью инцидента, и именно инцидент отображается и считается. Это устраняет дефект PP-1, при котором метрика активных отключений равнялась сумме сырых сообщений.

---

## SD-02. Закрытие инцидента

**FR:** FR-501…FR-505 · **TC:** TC-080…TC-084

```mermaid
sequenceDiagram
    autonumber
    actor U as Житель
    participant BOT as Bot Service
    participant API as Report API
    participant DB as PostgreSQL
    participant SCH as Scheduler
    participant K as Kafka

    rect rgb(240,248,255)
    note over U,DB: Путь 1 — явное сообщение о восстановлении
    U->>BOT: «⚡ Свет вернулся»
    BOT->>API: POST /v1/outages/{id}/restorations
    API->>DB: INSERT restoration (method=manual)
    API->>DB: пересчёт доли сообщивших о восстановлении
    alt доля ≥ порога ИЛИ подтверждено оператором
        API->>DB: outage.status = resolved (resolution_type=user_confirmed)
        API->>K: publish outage.resolved
    else доля ниже порога
        API->>DB: пометить репорт автора как восстановленный
        API-->>BOT: инцидент остаётся активным
    end
    BOT-->>U: «Спасибо, отметили»
    end

    rect rgb(255,248,240)
    note over SCH,DB: Путь 2 — автоматическое закрытие по тишине
    loop каждую минуту
        SCH->>DB: SELECT outages WHERE now() - last_report_at > TTL
        DB-->>SCH: список кандидатов
        SCH->>DB: status = resolved (resolution_type=timeout)
        SCH->>K: publish outage.resolved
    end
    end

    rect rgb(245,255,245)
    note over U,DB: Путь 3 — активный опрос
    SCH->>BOT: инцидент активен дольше медианы
    BOT->>U: «Свет уже вернулся?» [Да] [Нет]
    U->>BOT: Да
    BOT->>API: POST restorations (method=poll)
    end
```

**Важно для интерпретации данных:** длительность, полученная по пути 2, — верхняя оценка. Реальное восстановление произошло раньше последнего сообщения. Поле `resolution_type` сохраняется именно для того, чтобы аналитика могла разделить точные и оценочные длительности, а не смешивать их в одну медиану.

## SD-03. Рассылка уведомлений с эскалацией

**FR:** FR-701…FR-706 · **TC:** TC-100…TC-105

```mermaid
sequenceDiagram
    autonumber
    participant K as Kafka
    participant NS as Notification Service
    participant DB as PostgreSQL/PostGIS
    participant RD as Redis
    participant TG as Telegram API
    participant PUSH as Web Push
    actor U as Подписчик

    K->>NS: outage.confirmed
    NS->>DB: ST_DWithin(subscription.center, outage.centroid, radius_m)
    DB-->>NS: список подписок
    loop по каждой подписке
        NS->>NS: вычислить dedup_key
        NS->>RD: SETNX dedup_key TTL
        alt ключ уже существует
            NS->>NS: пропустить (повторное уведомление)
        else новый
            NS->>NS: определить приоритет
            alt тихие часы и приоритет ниже CRITICAL
                NS->>DB: notification (status=scheduled)
            else отправлять сейчас
                NS->>TG: sendMessage
                alt успех
                    TG-->>NS: 200
                    NS->>DB: status=sent
                else 429 rate limit
                    TG-->>NS: 429 retry_after
                    NS->>NS: backoff, повтор
                else постоянная ошибка
                    TG-->>NS: 403 blocked
                    NS->>DB: subscription.is_active=false
                end
                opt есть device_token и приоритет HIGH+
                    NS->>PUSH: web push
                end
            end
        end
    end
    TG-->>U: уведомление
    U->>TG: открывает карту
```

## SD-04. Импорт и разбор публикаций из внешнего источника

**FR:** FR-1101…FR-1104 · **TC:** TC-120…TC-123

```mermaid
sequenceDiagram
    autonumber
    participant SRC as Telegram-канал 1055
    participant ING as Ingest Worker
    participant NLP as Parser (NER)
    participant GEO as Geo Service
    participant VAL as Validation Engine
    participant DB as PostgreSQL
    participant MOD as Очередь модерации

    SRC->>ING: новая публикация
    ING->>DB: SELECT по external_message_id
    alt уже обработано
        ING->>ING: пропустить
    else новое сообщение
        ING->>DB: INSERT source_message (parse_status=pending)
        ING->>NLP: разобрать текст
        NLP->>NLP: извлечь район, улицы, время, тип работ
        alt уверенность разбора высокая
            NLP-->>ING: структурированный результат
            ING->>GEO: геокодировать улицы
            GEO-->>ING: координаты
            alt тип = плановые работы
                ING->>DB: INSERT planned_outage
            else тип = авария
                ING->>VAL: создать репорт от официального источника
                VAL->>DB: привязать к инциденту или создать новый
                note over VAL: вес официального источника выше,<br/>инцидент может подтвердиться сразу
            end
            ING->>DB: parse_status=parsed
        else уверенность низкая
            NLP-->>ING: частичный результат
            ING->>DB: parse_status=needs_review
            ING->>MOD: кейс на ручной разбор
        end
    end
```

Слой внешних данных остаётся отделимым: репорты из официальных публикаций помечены источником и могут быть исключены из выборки одним фильтром. Это сохраняет возможность сравнивать краудсорсинговую картину с официальной, а не смешивать их необратимо.

## SD-05. Модерация спорного инцидента

**FR:** FR-1203…FR-1206 · **TC:** TC-140…TC-143

```mermaid
sequenceDiagram
    autonumber
    actor M as Модератор
    participant UI as Admin Panel
    participant API as Admin API
    participant AZ as Authorization
    participant DB as PostgreSQL
    participant AUD as Audit Log
    participant K as Kafka

    M->>UI: открыть очередь модерации
    UI->>API: GET /v1/admin/moderation/cases?status=open
    API->>AZ: проверить moderation.read
    AZ-->>API: разрешено (scope: districts)
    API->>DB: выборка с приоритизацией
    DB-->>UI: кейсы
    M->>UI: взять кейс в работу
    UI->>API: POST /cases/{id}/claim
    API->>DB: assigned_to, claimed_at (блокировка)
    alt кейс уже взят другим
        DB-->>API: конфликт
        API-->>UI: 409 Conflict
    else успешно
        M->>UI: изучить репорты, точные координаты
        UI->>API: GET /reports?outage_id=...&precise=true
        API->>AZ: проверить outage.read_exact_geo
        M->>UI: решение «объединить с инцидентом X»
        UI->>API: POST /cases/{id}/resolve
        API->>DB: перепривязка репортов, пересчёт Confidence
        API->>AUD: запись before/after
        API->>K: publish outage.updated
        API-->>UI: 200 OK
    end
```

Любое решение модератора фиксируется в неизменяемом журнале вместе со снимком состояния до и после. Ручное вмешательство в данные, которые затем публикуются как независимые, должно быть восстановимо и проверяемо — иначе краудсорсинговый характер проекта становится декларацией.

---

## SD-06. Аутентификация администратора и обновление токена

**FR:** FR-101…FR-106 · **TC:** TC-010…TC-016

```mermaid
sequenceDiagram
    autonumber
    actor A as Администратор
    participant UI as Admin Panel
    participant AUTH as Auth Service
    participant DB as PostgreSQL
    participant RD as Redis

    A->>UI: email + пароль
    UI->>AUTH: POST /v1/auth/login
    AUTH->>RD: счётчик попыток по IP и аккаунту
    alt превышен лимит
        AUTH-->>UI: 429 (временная блокировка)
    else
        AUTH->>DB: проверка хеша пароля (argon2id)
        alt пароль неверен
            AUTH->>RD: инкремент счётчика
            AUTH-->>UI: 401 (сообщение без деталей)
        else пароль верен
            alt MFA включена
                AUTH-->>UI: требуется код
                A->>UI: TOTP
                UI->>AUTH: POST /auth/mfa
                AUTH->>AUTH: проверка окна TOTP
            end
            AUTH->>DB: INSERT session (refresh_token_hash)
            AUTH-->>UI: access (15 мин) + refresh (httpOnly, 30 дней)
        end
    end

    note over UI,AUTH: истечение access-токена
    UI->>AUTH: POST /v1/auth/refresh
    AUTH->>DB: поиск сессии по хешу
    alt токен отозван или переиспользован
        AUTH->>DB: отозвать все сессии пользователя
        AUTH-->>UI: 401, требуется повторный вход
    else валиден
        AUTH->>DB: ротация refresh-токена
        AUTH-->>UI: новая пара токенов
    end
```

Обнаружение повторного использования refresh-токена трактуется как компрометация и вызывает отзыв всех сессий пользователя, а не только текущей.

---

## SD-07. Официальное подтверждение от оператора

**FR:** FR-407, FR-1105

> **Правка после ревью (C-08).** В первой редакции официальное подтверждение выставляло уверенность 100. Это лишало систему возможности зафиксировать расхождение между официальной картиной и наблюдениями жителей — а такая возможность и есть одна из заявленных ценностей независимого сервиса. Вклад снижен до 90 с явной обработкой конфликта источников.

```mermaid
sequenceDiagram
    autonumber
    actor OP as Диспетчер энергокомпании
    participant EXT as Operator API
    participant API as Integration API
    participant VAL as Validation Engine
    participant DB as PostgreSQL
    participant K as Kafka
    participant NS as Notification Service

    OP->>EXT: регистрация аварии в своей системе
    EXT->>API: POST /v1/integration/outages (API-key + HMAC)
    API->>API: проверка подписи и таймстемпа
    API->>DB: поиск пересекающихся инцидентов
    alt найден краудсорсинговый инцидент
        API->>VAL: применить официальное подтверждение
        VAL->>DB: confidence = 90, source_mix=mixed
        note over VAL: официальный источник даёт высокий,<br/>но не предельный вклад — остаётся<br/>возможность опровержения
        alt массовые противоречащие сообщения жителей
            VAL->>DB: флаг source_conflict
            VAL->>DB: вынести в модерацию
        end
    else совпадений нет
        API->>DB: создать инцидент (source_mix=official)
    end
    API->>K: publish outage.confirmed
    K->>NS: рассылка подписчикам
    API-->>EXT: 202 Accepted
```

---

## SD-08. Публикация плановых отключений

**FR:** FR-1001…FR-1004

```mermaid
sequenceDiagram
    autonumber
    participant SRC as Источник плана
    participant ING as Ingest
    participant DB as PostgreSQL
    participant SCH as Scheduler
    participant NS as Notification Service
    actor U as Подписчик

    SRC->>ING: график работ
    ING->>DB: INSERT planned_outage (status=announced)
    SCH->>DB: подписки в зоне планового отключения
    SCH->>NS: уведомление за 24 ч и за 1 ч
    NS-->>U: «Плановые работы завтра 09:00–14:00»
    note over SCH,DB: в момент начала работ
    SCH->>DB: planned_outage.status=in_progress
    loop поступающие репорты из зоны
        DB->>DB: сопоставление outage → planned_outage_id
        note over DB: инцидент помечается как плановый<br/>и исключается из статистики аварийности
    end
    SCH->>DB: по завершении status=completed
```

Разделение плановых работ и аварий устраняет пробел, зафиксированный в границах текущего продукта: сейчас плановые отключения не выделяются как отдельная сущность и попадают в общую статистику аварийности, завышая её.

---

## SD-09. Офлайн-репорт (PWA)

**FR:** FR-307, OFF-01…OFF-04

```mermaid
sequenceDiagram
    autonumber
    actor U as Пользователь
    participant PWA as Web App
    participant SW as Service Worker
    participant IDB as IndexedDB
    participant API as Report API

    U->>PWA: сообщить об отключении
    PWA->>PWA: проверка сети
    alt сеть недоступна
        PWA->>IDB: сохранить черновик + Idempotency-Key
        PWA-->>U: «Сохранено, отправим при появлении сети»
        SW->>SW: Background Sync
        note over SW: сеть восстановилась
        SW->>IDB: прочитать очередь
        loop по каждому черновику
            SW->>API: POST /v1/reports (тот же ключ)
            alt принят
                API-->>SW: 201
                SW->>IDB: удалить черновик
            else устарел (старше окна актуальности)
                API-->>SW: 422
                SW->>IDB: удалить, уведомить пользователя
            end
        end
        SW-->>U: «Сообщение отправлено»
    else сеть есть
        PWA->>API: POST /v1/reports
    end
```

Идемпотентный ключ генерируется в момент создания черновика, а не отправки. Иначе повторная синхронизация после частичного сбоя породила бы дубликаты, которые кластеризация примет за независимые подтверждения и ложно повысит уверенность инцидента.

---

## SD-10. Экспорт данных

**FR:** FR-908, FR-1210

```mermaid
sequenceDiagram
    autonumber
    actor AN as Аналитик
    participant UI as Admin Panel
    participant API as Export API
    participant Q as Очередь задач
    participant W as Export Worker
    participant DB as PostgreSQL
    participant S3 as Object Storage

    AN->>UI: сформировать выгрузку
    UI->>API: POST /v1/exports
    API->>API: проверка прав и объёма выборки
    API->>Q: поставить задачу
    API-->>UI: 202 + export_id
    UI->>UI: опрос статуса
    W->>Q: взять задачу
    W->>DB: потоковое чтение (cursor)
    W->>W: применить огрубление геоданных по роли
    W->>S3: записать файл
    W->>DB: status=ready, ссылка с TTL
    UI->>API: GET /v1/exports/{id}
    API-->>AN: подписанная ссылка (истекает)
```

Выгрузка всегда проходит через огрубление координат согласно правам запрашивающего. Экспорт — самый вероятный путь непреднамеренной утечки точных геоданных, поэтому ограничение применяется в воркере, а не на уровне UI.

# 20. Deployment & DevOps

## 1. Топология окружений

> **Конфликт требований (C-09).** Строка `dr` предполагает резервную площадку в другом регионе.
> При этом NFR-PR-02 требует хранения персональных данных граждан на территории Узбекистана.
> Эти два требования могут прямо противоречить друг другу. Правовая проверка не проводилась.
> До заключения юриста резервная площадка планируется **в пределах территории страны**, даже если
> это означает меньшую географическую разнесённость и худшую защиту от регионального отказа.
> Соответствие закону здесь приоритетнее показателя доступности.


| Окружение | Назначение | Инфраструктура | Данные | Доступ |
|---|---|---|---|---|
| `dev` | Разработка | 1 узел, docker-compose / kind | Синтетические | Разработчики |
| `stage` | Приёмка, нагрузка, демо | K8s, сокращённые реплики | Обезличенная копия prod | Команда + PO |
| `prod` | Продакшн | K8s, 3 AZ | Реальные | Только через CI + on-call |
| `dr` | Аварийное восстановление | Другой регион, тёплый резерв | Асинхронная реплика | Только при активации |

**Пространства имён в кластере:**

| Namespace | Компоненты | Сетевые правила |
|---|---|---|
| `public` | Web, Map Service, Public API, CDN origin | Входящий трафик из интернета через ingress |
| `processing` | Validation Engine, Ingest Worker, Notification Service, ML-инференс | Нет входящего внешнего трафика |
| `admin` | Admin API, Admin UI | Ingress с ограничением по IP + mTLS |
| `platform` | Kafka, Redis, наблюдаемость, cron | Только внутрикластерный доступ |

NetworkPolicy — deny-by-default; разрешения задаются явно между конкретными парами.

---

## 2. Контейнеризация

### Принципы

- Multi-stage сборка; в финальный образ не попадают компилятор, тесты и исходники
- Базовый образ — distroless или alpine с фиксированным дайджестом, не тегом
- Непривилегированный пользователь, read-only корневая ФС
- Один процесс на контейнер; никаких supervisor
- Образ не содержит секретов; конфигурация — через переменные окружения и смонтированные секреты
- Тег образа = git SHA; `latest` не используется нигде

### Пример Dockerfile (сервис на Go)

```dockerfile
# --- build stage ---
FROM golang:1.22-alpine AS build
WORKDIR /src
COPY go.mod go.sum ./
RUN go mod download
COPY . .
RUN CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o /out/app ./cmd/api

# --- runtime stage ---
FROM gcr.io/distroless/static-debian12:nonroot
COPY --from=build /out/app /app
USER nonroot:nonroot
EXPOSE 8080
ENTRYPOINT ["/app"]
```

### Пример Dockerfile (Python-воркер с ML)

```dockerfile
FROM python:3.12-slim AS build
WORKDIR /src
RUN pip install --no-cache-dir poetry==1.8.*
COPY pyproject.toml poetry.lock ./
RUN poetry export -f requirements.txt --without-hashes -o req.txt
RUN pip install --no-cache-dir --prefix=/install -r req.txt

FROM python:3.12-slim
RUN useradd -u 10001 -m worker
COPY --from=build /install /usr/local
COPY --chown=worker:worker src/ /app/
USER worker
WORKDIR /app
ENTRYPOINT ["python", "-m", "worker"]
```

---

## 3. Kubernetes

### Deployment (фрагмент, Validation Engine)

```yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: validation-engine
  namespace: processing
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: validation-engine }
  template:
    metadata:
      labels: { app: validation-engine }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: validation-engine
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app: validation-engine }
      containers:
        - name: app
          image: registry.internal/validation-engine@sha256:<digest>
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits:   { cpu: "2000m", memory: "1Gi" }
          envFrom:
            - configMapRef: { name: validation-config }
            - secretRef:    { name: validation-secrets }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 5
          startupProbe:
            httpGet: { path: /healthz, port: 8080 }
            failureThreshold: 30
            periodSeconds: 2
          lifecycle:
            preStop:
              exec: { command: ["sleep", "10"] }
      terminationGracePeriodSeconds: 60
```

### Автоскейлинг

```yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: validation-engine
  namespace: processing
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: validation-engine
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
    - type: Pods
      pods:
        metric: { name: kafka_consumer_lag }
        target: { type: AverageValue, averageValue: "1000" }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies: [{ type: Percent, value: 100, periodSeconds: 30 }]
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{ type: Percent, value: 25, periodSeconds: 60 }]
```

Асимметрия окон намеренная: всплеск сообщений при массовой аварии наступает за секунды, а спад активности не должен вызывать преждевременного сжатия мощности.

### PodDisruptionBudget

```yaml
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: validation-engine
  namespace: processing
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: validation-engine }
```

### Сводка по ресурсам (prod, ступень S1)

| Компонент | Реплики | CPU req/lim | Mem req/lim | HPA |
|---|---|---|---|---|
| Web / SSR | 3–12 | 250m / 1000m | 256Mi / 512Mi | CPU |
| Public API | 4–20 | 500m / 2000m | 512Mi / 1Gi | CPU + RPS |
| Map Service | 4–24 | 500m / 2000m | 1Gi / 2Gi | CPU + RPS |
| Bot Service | 3–10 | 250m / 1000m | 256Mi / 512Mi | Очередь апдейтов |
| Validation Engine | 3–30 | 500m / 2000m | 512Mi / 1Gi | Consumer lag |
| Notification Service | 3–20 | 250m / 1000m | 512Mi / 1Gi | Consumer lag |
| Ingest Worker | 2–6 | 250m / 1000m | 512Mi / 1Gi | Consumer lag |
| Admin API | 2–4 | 250m / 1000m | 256Mi / 512Mi | CPU |
| Stat Aggregator | CronJob | 1000m / 4000m | 2Gi / 4Gi | — |

## 4. CI/CD

### Пайплайн

```mermaid
flowchart LR
    A[Push / PR] --> B[Lint + форматирование]
    B --> C[Unit-тесты]
    C --> D[SAST + аудит зависимостей]
    D --> E[Сборка образа]
    E --> F[Скан образа]
    F --> G[Интеграционные тесты]
    G --> H{Ветка main?}
    H -- нет --> I[Отчёт в PR]
    H -- да --> J[Публикация образа + SBOM]
    J --> K[Автовыкат stage]
    K --> L[E2E + DAST]
    L --> M[Нагрузочный тест по расписанию]
    M --> N{Ручное подтверждение}
    N --> O[Выкат prod: Blue-Green / Canary]
    O --> P[Smoke + мониторинг]
    P --> Q{Пороги в норме?}
    Q -- нет --> R[Автооткат]
    Q -- да --> S[Завершение выката]
```

### GitHub Actions (фрагмент)

```yaml
name: ci
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - run: make lint
      - run: make test-unit
      - name: SAST
        run: make sast
      - name: Аудит зависимостей
        run: make deps-audit

  build:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сборка и публикация
        run: |
          IMAGE=registry.internal/${{ github.event.repository.name }}
          docker build -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:${{ github.sha }}
      - name: Скан образа
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL $IMAGE:${{ github.sha }}
      - name: SBOM
        run: syft $IMAGE:${{ github.sha }} -o spdx-json > sbom.json

  deploy-stage:
    needs: build
    runs-on: ubuntu-latest
    environment: stage
    steps:
      - name: Обновить манифест в GitOps-репозитории
        run: ./scripts/bump-image.sh stage ${{ github.sha }}

  deploy-prod:
    needs: deploy-stage
    runs-on: ubuntu-latest
    environment:
      name: prod          # требует ручного подтверждения
    steps:
      - run: ./scripts/bump-image.sh prod ${{ github.sha }}
```

### GitLab CI (эквивалент, фрагмент)

```yaml
stages: [verify, build, deploy-stage, deploy-prod]

variables:
  IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

verify:
  stage: verify
  script: [make lint, make test-unit, make sast]

build:
  stage: build
  only: [main]
  script:
    - docker build -t $IMAGE .
    - trivy image --exit-code 1 --severity HIGH,CRITICAL $IMAGE
    - docker push $IMAGE

deploy-prod:
  stage: deploy-prod
  when: manual
  environment: { name: production }
  script: [./scripts/bump-image.sh prod $CI_COMMIT_SHA]
```

Развёртывание выполняется по модели GitOps: пайплайн не имеет доступа к кластеру, он лишь меняет тег образа в репозитории манифестов, откуда изменение подхватывает Argo CD. Это устраняет необходимость хранить kubeconfig в CI.

---

## 5. Стратегии выката

### Blue-Green (API)

| Шаг | Действие | Критерий |
|---|---|---|
| 1 | Развернуть green с новым образом | Все поды Ready |
| 2 | Прогнать smoke-тесты по внутреннему адресу green | 100% успешно |
| 3 | Переключить сервис на green | — |
| 4 | Наблюдение 30 мин | Ошибки ≤ baseline + 0.5 п.п., p95 ≤ baseline × 1.2 |
| 5 | Держать blue 24 ч, затем удалить | — |

Откат — обратное переключение сервиса, время выполнения около минуты.

### Canary (валидация, уведомления, изменения метрик)

| Стадия | Доля трафика | Длительность | Автопродвижение при |
|---|---|---|---|
| 1 | 5% | 15 мин | error rate < 1%, p95 < SLO |
| 2 | 25% | 30 мин | те же + отсутствие роста жалоб |
| 3 | 50% | 1 ч | те же |
| 4 | 100% | — | — |

Анализ по метрикам: `http_request_errors_total`, `http_request_duration_seconds`, `validation_confidence_shift`, `notifications_failed_total`.

**Специальный порог для изменений валидации:** сдвиг доли подтверждённых инцидентов более чем на 15 процентных пунктов относительно контрольной группы останавливает продвижение независимо от технических метрик. Технически корректный релиз может испортить содержательное качество данных, и этот случай нужно ловить отдельно.

### Миграции БД

Правило: схема совместима на одну версию вперёд и назад. Порядок — expand / migrate / contract:

1. **Expand** — добавить новые колонки и таблицы, не удаляя старые; выкатить код, умеющий читать оба варианта
2. **Migrate** — фоновое заполнение данных пакетами, без длинных блокировок
3. **Contract** — отдельным релизом удалить неиспользуемое, не раньше чем через один цикл

Индексы создаются с `CONCURRENTLY`. Изменения, требующие переписывания больших таблиц, выполняются через теневую таблицу с переключением.

---

## 6. Infrastructure as Code

```
infra/
├── modules/
│   ├── network/           # VPC, подсети, NAT, security groups
│   ├── kubernetes/        # кластер, пулы узлов, IRSA
│   ├── database/          # PostgreSQL HA, реплики, бэкапы, PITR
│   ├── cache/             # Redis, режим кластера
│   ├── streaming/         # Kafka, топики, retention
│   ├── storage/           # объектное хранилище, политики жизненного цикла
│   ├── cdn/               # раздача тайлов и статики
│   ├── observability/     # метрики, логи, трассировки, алерты
│   └── secrets/           # secret manager, политики доступа
├── envs/
│   ├── stage/
│   ├── prod/
│   └── dr/
└── policies/              # OPA/Conftest для проверки манифестов
```

Правила: состояние хранится удалённо с блокировкой; `terraform plan` обязателен в PR и публикуется как комментарий; `apply` в prod требует подтверждения второго инженера; дрейф конфигурации проверяется по расписанию, расхождение — алерт.

---

## 7. Конфигурация и секреты

| Тип | Хранение | Ротация |
|---|---|---|
| Параметры приложения | ConfigMap из Git | При релизе |
| Параметры валидации (R, T, N, TTL) | Таблица `settings`, доступна из админ-панели | По решению PO, с записью в аудит |
| Пароли БД | Secret manager, инжект через CSI | 90 дней, автоматически |
| Токен Telegram-бота | Secret manager | По инциденту |
| API-ключи партнёров | Хеш в БД, значение показывается один раз | По запросу |
| Ключи подписи JWT | Secret manager, поддержка двух активных ключей | 30 дней, с перекрытием |

Секреты никогда не попадают в образ, в переменные CI-логов и в git. Проверка на утечки — обязательный шаг пайплайна.

---

## 8. Наблюдаемость

| Слой | Инструмент | Хранение |
|---|---|---|
| Метрики | Prometheus + Thanos | 15 дней в горячем, 13 месяцев в объектном |
| Логи | OpenSearch, структурированный JSON | 30 дней; аудит — 3 года |
| Трассировки | OpenTelemetry + Tempo | 7 дней, сэмплирование 10% (100% для ошибок) |
| Дашборды | Grafana | — |
| Алерты | Alertmanager → дежурный канал | — |

**Обязательные корреляционные поля во всех логах:** `trace_id`, `request_id`, `outage_id`, `district_id`. Без сквозного `outage_id` расследование расхождения метрик после релиза инцидентной модели практически невозможно.

### Ключевые алерты

| Алерт | Условие | Severity |
|---|---|---|
| API error rate | >2% за 5 мин | P1 |
| API latency p95 | > SLO за 10 мин | P2 |
| Consumer lag | >10 000 сообщений за 5 мин | P1 |
| Репорты не поступают | 0 репортов за 20 мин в дневные часы | P2 |
| Доля подтверждений | Отклонение >20 п.п. от недельного профиля | P2 |
| Уведомления не доставляются | Failure rate >5% | P1 |
| Реплика БД отстаёт | Lag >60 с | P1 |
| Диск БД | <20% свободно | P2 |
| Сертификат | Истекает <14 дней | P3 |

Алерт «репорты не поступают» существует потому, что для краудсорсингового сервиса тишина неотличима от исправной работы. Отсутствие данных — самый вероятный незамеченный отказ.

---

## 9. Резервное копирование и восстановление

| Параметр | Значение |
|---|---|
| Полный бэкап БД | Ежедневно |
| WAL / непрерывное архивирование | Постоянно, PITR |
| RPO | 5 минут |
| RTO | 30 минут |
| Хранение | 30 дней ежедневных, 12 месячных |
| Шифрование | На стороне хранилища + собственный ключ |
| Проверка восстановления | Ежемесячно на изолированном окружении, с фиксацией фактического времени |

Бэкап, который никогда не восстанавливали, считается несуществующим — регулярная проверка входит в обязанности дежурного, а не в план «когда-нибудь».

### Сценарии отказа

| Сценарий | Реакция | Целевое время |
|---|---|---|
| Падение пода | Kubernetes перезапускает | Автоматически |
| Отказ узла | Перепланирование, topology spread | <2 мин |
| Отказ зоны | Трафик на оставшиеся 2 AZ | <5 мин, деградация ёмкости |
| Отказ основной БД | Автопереключение на синхронную реплику | <2 мин |
| Отказ региона | Активация DR: смена DNS, промоут реплики | ≤30 мин |
| Недоступен Telegram API | Очередь с backoff, сайт работает, репорты через веб (Ph.3) | Деградация |
| Недоступен внешний источник 1055 | Слой скрывается с пометкой, ядро работает | Деградация |

---

## 10. Runbook (выдержки)

### Рост consumer lag в Validation Engine

1. Проверить дашборд: растёт ли входящий поток или упала обработка
2. Если поток вырос (массовая авария) — убедиться, что HPA отработал; при упоре в `maxReplicas` поднять лимит
3. Если поток нормальный — проверить latency БД и время ответа ML-инференса
4. При деградации инференса — перевести валидацию в правиловый режим через feature flag, качество снизится, но обработка продолжится
5. Зафиксировать инцидент, при повторении — вынести на ретроспективу

### Расхождение публичных метрик после релиза

1. Не исправлять данные вручную
2. Сравнить агрегаты витрин с прямым подсчётом по `reports` и `outages`
3. Проверить, не изменились ли параметры валидации в `settings` (аудит покажет, кем и когда)
4. При подтверждённой ошибке расчёта — откатить релиз витрин, пересчитать, опубликовать пояснение
5. Если изменение цифр ожидаемо и корректно — опубликовать методологическое пояснение, а не молча оставить новую цифру

### Подозрение на массовую накрутку

1. Открыть дашборд подозрительной активности
2. Перевести затронутый район в режим повышенного порога подтверждения через feature flag
3. Пометить подозрительные репорты shadow-режимом, не удаляя их
4. Разбор через очередь модерации с фиксацией в аудите
5. По итогам — уточнить правила анти-фрода, а не только заблокировать аккаунты

---

## C-01. Числовые параметры валидации выдуманы

**Что не так.** В спецификации фигурировали `cluster_radius_m: 300`, `min_distinct_reporters: 3`, `confirm_confidence_threshold: 70`, а в модели Confidence Score — веса 0.30 / 0.25 / 0.15 / 0.10 / 0.10 / 0.05 / 0.05. Ни одно из этих значений не выведено из данных. Веса подобраны так, чтобы сумма равнялась единице, и не более того.

**Почему это серьёзнее обычной условности.** Пакет в нескольких местах критикует продукт именно за то, что радиус подтверждения не документирован, и специально отмечает: значение 300 м встречается в публикациях СМИ, но первоисточником не подтверждается. После чего 300 м попало в пример спецификации как рабочее значение. Читатель, взявший спецификацию за основу, получил бы непроверенное число, легитимированное собственной же документацией.

**Исправлено.** В `17_OpenAPI.yaml` значения примера заменены нулями с явной пометкой, что это плейсхолдеры формата ответа.

**Что требуется сделать до реализации.** Калибровка на исторических данных: подобрать радиус и окно так, чтобы кластеризация воспроизводила известные подтверждённые аварии и не склеивала независимые. Веса Confidence Score — либо обучение на размеченной выборке, либо экспертная оценка, зафиксированная как экспертная. Формулировка «параметр подлежит калибровке» честнее любого правдоподобного числа.

---

## C-02. Горизонт 10 млн пользователей

**Что не так.** Ступени масштабирования доведены до 10 млн пользователей при населении Ташкента около 3 млн. Даже полный охват города и области не даёт такой величины. Ни одна цель продукта не заявляет выхода за пределы страны.

**Последствие.** Ступени S4–S5 тянули за собой выбор технологий (отдельный кластер стриминга, активный-активный мульти-AZ), который затем попал в архитектуру и бюджет как обязательный.

**Исправлено.** Плановый горизонт снижен до 500 тыс. пользователей; S4–S5 помечены как теоретический предел, не влияющий на выбор технологий.

---

## C-03. Противоречие критериев приёмки миграции

**Что не так.** В бэклоге DoD для инцидентной модели требовал расхождения агрегатов с исходными данными не более 1%. В релиз-плане тот же переход описан как приводящий к резкому падению публикуемой цифры, требующему отдельного объяснения. Оба утверждения не могут быть верны: переход от подсчёта сообщений к подсчёту инцидентов меняет величину кратно — это и есть цель изменения.

**Исправлено.** Критерий переформулирован: воспроизводимость результата и объяснимость каждого расхождения вместо близости к старым числам.

---

## C-04. Экономика не сходится

**Что не так.** Продукт заявлен как некоммерческий, без монетизации. Предложенная целевая архитектура — Kubernetes в трёх зонах доступности, Kafka, PostgreSQL в режиме высокой доступности, отдельный DR-регион, OpenSearch, Prometheus с длительным хранением, ML-инференс — требует постоянных расходов на инфраструктуру и как минимум нескольких инженеров. Ресурсный план в дорожной карте предполагает рост до 11 FTE. Источник финансирования нигде не определён.

**Почему это не устраняется расчётом ROI.** Раздел ROI/SROI в BRD оперирует общественной ценностью (сэкономленное время жителей, снижение нагрузки на службу 1055). Это корректный аргумент для гранта или для государственного партнёрства, но он не порождает денежного потока и не покрывает счета за инфраструктуру.

**Что делать.** До принятия архитектуры нужен ответ на вопрос о модели финансирования. Возможные варианты — грантовое финансирование, партнёрство с оператором энергосети, институциональное донорство. Если ответа нет, корректной целевой архитектурой является не предложенная, а существенно более скромная: один управляемый PostgreSQL, монолит с фоновыми задачами, очередь на Redis вместо Kafka, отсутствие ML. Такая система обслуживает сотни тысяч пользователей и поддерживается одним-двумя инженерами. **Это ограничение следует признать честно: пакет описывает архитектуру, которую проект в текущем виде, вероятно, не может себе позволить.**

---

## C-05. Оценки SP и WSJF проставлены без команды

Story points — мера относительной сложности для конкретной команды с её опытом и контекстом. Оценка, проставленная снаружи, не имеет этого значения. То же с WSJF: составляющие ценности и срочности — предмет решения владельца продукта, а не документа. Приведённые числа следует рассматривать как черновой порядок величин для первого планирования, подлежащий полной переоценке командой.

---

## C-06. Персоны и JTBD без исследования

Восемь персон с именами, возрастом и мотивацией, десять формулировок JTBD, карта пути пользователя — всё построено рассуждением, без интервью, опросов и аналитики поведения. Персоны выглядят убедительно ровно потому, что сконструированы непротиворечивыми; реальные пользователи такими не бывают. Риск в том, что приоритеты функций выстроены под воображаемых людей. До первых интервью персоны следует считать гипотезами, а не входными данными.

---

## C-07. Вывод о дефекте метрики — индукция по одному совпадению

Утверждение, что показатель активных отключений равен сумме сырых сообщений, опирается на единственное арифметическое совпадение: 55 + 4 + 3 + 2 + 1 + 1 + 10 = 76. Совпадение сильное и вряд ли случайно, но одно наблюдение не доказывает отсутствие дедупликации: возможно, в данный момент попросту не было сообщений, подлежащих объединению.

**Как проверить дёшево.** Повторить сверку в момент массовой аварии, когда из одного дома приходит несколько сообщений. Если сумма по районам снова совпадёт с итогом — вывод подтверждён. Расхождение будет означать, что некоторая дедупликация существует, и диагноз нужно уточнить.

При этом отдельное наблюдение — включение строки «Область и пригород» в общий счёт наряду с районами города — остаётся верным независимо от исхода проверки.

---

## C-08. Официальное подтверждение выставляет confidence = 100

**Что не так.** В диаграмме официального подтверждения оператор выставляет уверенность в 100 и статус подтверждённого инцидента. Значение 100 не оставляет места для последующего опровержения: любое расхождение с реальностью придётся исправлять вручную, ломая шкалу.

**Почему это важно именно здесь.** Проект существует как независимый источник данных. Конструкция, при которой сообщение оператора автоматически становится абсолютной истиной, лишает сервис способности зафиксировать расхождение между официальной картиной и наблюдениями жителей — а это одна из заявленных ценностей.

**Как исправить.** Официальное подтверждение должно давать высокий, но не предельный вклад (например, порядка 90), с сохранением возможности снижения при массовых противоречащих сообщениях. Отдельный флаг конфликта источников, выносящий случай в модерацию, полезнее принудительной единой истины.

---

## C-09. Правовое поле не проверено

Пакет оперирует персональными данными (геолокация, идентификаторы Telegram), предлагает трёхлетнее хранение аудита и резервный регион для аварийного восстановления. Требования законодательства Узбекистана о персональных данных, включая возможные требования к локализации хранения на территории страны, не проверялись. Рекомендация о резервном регионе может прямо противоречить таким требованиям. Раздел приватности написан по общим принципам минимизации, а не по применимому закону. Перед реализацией необходима юридическая проверка.

---

## C-10. Метрики качества ML заявлены без данных

Точность не ниже 95% и доля ложных срабатываний не выше 2% для детекции недостоверных сообщений названы целевыми. Размеченной выборки не существует: разметки достоверности сообщений в продукте нет. Заявлять целевую точность до появления данных и базового решения бессмысленно — цифры не на чем проверить. Корректный порядок: сначала накопить размеченные случаи через ручную модерацию, затем правиловая базовая линия, затем — только если она недостаточна — модель, и целевые метрики устанавливаются относительно базовой линии.

---

## C-11. Coverage Index не валидирован

Формула индекса покрытия и пороги отнесения района к низкому, среднему и высокому покрытию предложены умозрительно. Индекс призван предупреждать, что малое число инцидентов может отражать отсутствие участников, а не благополучие сети, — задача поставлена верно. Но непроверенная формула способна создать обратную проблему: район с реально хорошей сетью получит ярлык недостаточного покрытия, и корректные данные будут дискредитированы. До валидации на данных индекс следует показывать как справочный сигнал, а не как основание не доверять цифрам.

---

## C-12. Трассируемость не проверена автоматически

Матрицы соответствия между требованиями, тест-кейсами и элементами бэклога составлялись вручную. Автоматической проверки ссылочной целостности не проводилось. Вероятны разрывы: требования без тест-кейсов, ссылки на несуществующие идентификаторы. Перед передачей в работу стоит прогнать простой скрипт, извлекающий все идентификаторы и проверяющий взаимные ссылки.

---

## Что в пакете устойчиво

Разбор не отменяет содержательного ядра. Устойчивыми остаются выводы, опирающиеся на прямые утверждения первоисточников продукта:

- **Разделение сообщения и инцидента** обосновано независимо от точности диагноза C-07: даже при наличии частичной дедупликации сущность инцидента отсутствует в модели, а метрики строятся на сообщениях.
- **Длительность — верхняя оценка.** Это следует из явного утверждения самого продукта о том, что подсчёт ведётся по сообщениям жителей, а электроснабжение восстанавливается раньше, чем прекращаются сообщения.
- **Кнопка возвращения света убирает только точку нажавшего** — прямое утверждение источника, следствие для интерпретации данных выведено корректно.
- **Плановые отключения не выделены** как отдельная сущность и попадают в статистику аварийности — прямое утверждение источника.
- **Строка «Область и пригород» суммируется с районами города**, не являясь районом города.
- **Разные охваты карты и статистики** — прямое утверждение источника, делающее прямое сравнение чисел некорректным.
- **Необходимость публиковать правила подтверждения.** Аргумент нормативный, а не эмпирический: сервис, позиционирующий себя как независимый источник данных, должен допускать внешнюю проверку правил, по которым эти данные получены.

## Рекомендуемый порядок действий

| Шаг | Действие | Зачем |
|---|---|---|
| 1 | Определить модель финансирования | Без этого выбор архитектуры произволен (C-04) |
| 2 | Повторить сверку метрики при массовой аварии | Подтвердить или уточнить диагноз (C-07) |
| 3 | Провести 8–12 интервью с пользователями | Заменить гипотезы персон данными (C-06) |
| 4 | Юридическая проверка обработки данных | Устранить правовой риск (C-09) |
| 5 | Калибровать параметры кластеризации на истории | Заменить плейсхолдеры значениями (C-01) |
| 6 | Переоценить бэклог силами команды | Получить пригодные для планирования оценки (C-05) |
| 7 | Прогнать проверку трассируемости | Устранить разрывы ссылок (C-12) |

Пункты 1 и 2 логически предшествуют всему остальному: первый определяет, какая архитектура вообще применима, второй — верен ли центральный диагноз, вокруг которого выстроен пакет.

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<script>
(function(){
  "use strict";

  var sources = {};
  Array.prototype.forEach.call(document.querySelectorAll("script.src"), function(s){
    sources[s.dataset.file] = s.textContent;
  });

  var items = Array.prototype.slice.call(document.querySelectorAll(".nav-item"));
  var order = items.map(function(b){ return b.dataset.file; });

  var docEl   = document.getElementById("doc");
  var crumbEl = document.getElementById("crumb");
  var railEl  = document.getElementById("rail");
  var menuBtn = document.getElementById("menu");
  var current = null;
  var mermaidReady = (typeof mermaid !== "undefined");

  if (mermaidReady) {
    mermaid.initialize({
      startOnLoad:false,
      securityLevel:"loose",
      theme:"base",
      fontFamily:'-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif',
      themeVariables:{
        background:"#FFFFFF",
        primaryColor:"#EDF3F4",
        primaryTextColor:"#16232B",
        primaryBorderColor:"#1B5E78",
        lineColor:"#5C7A86",
        secondaryColor:"#F3F0F8",
        tertiaryColor:"#FAFCFB",
        noteBkgColor:"#FDF4E8",
        noteBorderColor:"#D9822B",
        noteTextColor:"#4A3A24",
        actorBkg:"#EDF3F4",
        actorBorder:"#1B5E78",
        actorTextColor:"#16232B",
        signalColor:"#41525E",
        signalTextColor:"#16232B",
        labelBoxBkgColor:"#EDF3F4",
        labelBoxBorderColor:"#1B5E78",
        clusterBkg:"#FAFCFB",
        clusterBorder:"#DBE3E4",
        fontSize:"14px"
      },
      flowchart:{ curve:"basis", useMaxWidth:true, htmlLabels:true },
      sequence:{ useMaxWidth:true, wrap:true, width:170, actorMargin:44, mirrorActors:false },
      er:{ useMaxWidth:true },
      gantt:{ useMaxWidth:true }
    });
  }

  if (typeof marked !== "undefined") {
    marked.setOptions({ gfm:true, breaks:false, headerIds:true, mangle:false });
  }

  function figure(index, code){
    var wrap = document.createElement("div");
    wrap.className = "fig";
    wrap.innerHTML =
      '<div class="fig-bar">' +
        '<span class="lbl">Схема ' + index + '</span>' +
        '<span class="spacer"></span>' +
        '<button class="btn js-zoom" type="button">Увеличить</button>' +
        '<button class="btn js-code" type="button">Показать код</button>' +
      '</div>' +
      '<div class="fig-body"></div>';
    wrap.dataset.code = code;
    return wrap;
  }

  function renderDoc(file){
    var md = sources[file];
    if (md === undefined){ return; }
    current = file;

    docEl.innerHTML = marked.parse(md);
    crumbEl.textContent = file;

    items.forEach(function(b){ b.classList.toggle("active", b.dataset.file === file); });

    // таблицы — в скроллируемую обёртку
    Array.prototype.forEach.call(docEl.querySelectorAll("table"), function(t){
      if (t.parentNode.classList.contains("tw")) return;
      var w = document.createElement("div"); w.className = "tw";
      t.parentNode.insertBefore(w, t); w.appendChild(t);
    });

    // mermaid-блоки → фигуры
    var blocks = Array.prototype.filter.call(
      docEl.querySelectorAll("pre code"),
      function(c){ return /language-mermaid/.test(c.className); }
    );

    var figs = [];
    blocks.forEach(function(code, i){
      var pre  = code.parentNode;
      var text = code.textContent;
      var fig  = figure(i + 1, text);
      pre.parentNode.replaceChild(fig, pre);
      figs.push(fig);
    });

    if (figs.length && mermaidReady){
      figs.forEach(function(fig, i){
        var body = fig.querySelector(".fig-body");
        var id   = "m-" + Date.now() + "-" + i;
        try {
          mermaid.render(id, fig.dataset.code).then(function(res){
            body.innerHTML = res.svg;
          }).catch(function(err){
            showError(fig, body, err);
          });
        } catch (err){
          showError(fig, body, err);
        }
      });
    } else if (figs.length && !mermaidReady){
      figs.forEach(function(fig){
        var body = fig.querySelector(".fig-body");
        body.innerHTML = '<pre style="text-align:left">' + escapeHtml(fig.dataset.code) + '</pre>';
        var n = document.createElement("div");
        n.className = "fig-err";
        n.textContent = "Библиотека Mermaid не загрузилась — показан исходный код схемы. Проверьте подключение к сети и обновите страницу.";
        fig.appendChild(n);
      });
    }

    window.scrollTo(0, 0);
    if (window.innerWidth <= 1000) closeRail();
  }

  function showError(fig, body, err){
    body.innerHTML = '<pre style="text-align:left">' + escapeHtml(fig.dataset.code) + '</pre>';
    var n = document.createElement("div");
    n.className = "fig-err";
    n.innerHTML = "Схема не отрисовалась — показан исходный код.<pre>" +
                  escapeHtml(String(err && err.message ? err.message : err)) + "</pre>";
    fig.appendChild(n);
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  // делегирование: увеличение и показ кода
  docEl.addEventListener("click", function(e){
    var zoomBtn = e.target.closest(".js-zoom");
    var codeBtn = e.target.closest(".js-code");
    var bodyEl  = e.target.closest(".fig.zoom .fig-body");

    if (zoomBtn){
      var f = zoomBtn.closest(".fig");
      f.classList.toggle("zoom");
      zoomBtn.textContent = f.classList.contains("zoom") ? "Уменьшить" : "Увеличить";
      return;
    }
    if (bodyEl){
      var f2 = bodyEl.closest(".fig");
      f2.classList.remove("zoom");
      f2.querySelector(".js-zoom").textContent = "Увеличить";
      return;
    }
    if (codeBtn){
      var f3 = codeBtn.closest(".fig");
      var existing = f3.querySelector(".fig-src");
      if (existing){
        existing.remove();
        codeBtn.textContent = "Показать код";
      } else {
        var p = document.createElement("pre");
        p.className = "fig-src";
        p.style.margin = "0";
        p.style.borderTop = "1px solid #DBE3E4";
        p.textContent = f3.dataset.code;
        f3.appendChild(p);
        codeBtn.textContent = "Скрыть код";
      }
    }
  });

  // навигация
  items.forEach(function(b){
    b.addEventListener("click", function(){
      location.hash = b.dataset.file;
    });
  });

  function step(delta){
    var i = order.indexOf(current);
    var j = i + delta;
    if (j >= 0 && j < order.length) location.hash = order[j];
  }
  document.getElementById("prev").addEventListener("click", function(){ step(-1); });
  document.getElementById("next").addEventListener("click", function(){ step(1); });

  document.addEventListener("keydown", function(e){
    if (e.target.tagName === "INPUT") return;
    if (e.key === "ArrowLeft")  step(-1);
    if (e.key === "ArrowRight") step(1);
    if (e.key === "Escape")     closeRail();
  });

  // фильтр
  document.getElementById("q").addEventListener("input", function(e){
    var v = e.target.value.trim().toLowerCase();
    items.forEach(function(b){
      var hit = !v || b.textContent.toLowerCase().indexOf(v) !== -1;
      b.parentNode.style.display = hit ? "" : "none";
    });
    Array.prototype.forEach.call(document.querySelectorAll(".grp"), function(g){
      var any = Array.prototype.some.call(g.querySelectorAll("li"), function(li){
        return li.style.display !== "none";
      });
      g.style.display = any ? "" : "none";
    });
  });

  // мобильное меню
  function openRail(){ railEl.classList.add("open"); menuBtn.setAttribute("aria-expanded","true"); }
  function closeRail(){ railEl.classList.remove("open"); menuBtn.setAttribute("aria-expanded","false"); }
  menuBtn.addEventListener("click", function(){
    railEl.classList.contains("open") ? closeRail() : openRail();
  });

  // маршрутизация
  function route(){
    var f = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!sources[f]) f = order[0];
    renderDoc(f);
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
