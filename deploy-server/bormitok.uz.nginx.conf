# bormitok.uz — XOST nginx sayti (Sveta.Net veb-xaritasi).
#
#   sudo cp bormitok.uz.nginx.conf /etc/nginx/sites-available/bormitok.uz
#   sudo ln -s /etc/nginx/sites-available/bormitok.uz /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d bormitok.uz -d www.bormitok.uz
#
# Nima uchun xostda, konteynerda emas: bu serverda nginx allaqachon
# droneguard.uz va admin.droneguard.uz ni xizmat qilyapti, ya'ni 80/443
# portlari band — konteyner ularni ololmaydi. Sertifikatlar ham bitta
# joyda (certbot xostda) turgani ma'qul.
#
# Vazifasi bitta: bormitok.uz ni `sveta-web` konteyneriga (127.0.0.1:8080)
# uzatish. Statik sahifa, `/api/` va `/telegram/webhook` ni o'sha konteyner
# ichidagi nginx allaqachon ajratadi (`sveta/deploy/nginx.locations.conf`) —
# ya'ni bu yerda marshrutlash takrorlanmaydi va ikki fayl ajralib keta
# olmaydi.
#
# ⚠️ certbot birinchi marta yurgizilganda 443 blokini va sertifikat
# yo'llarini SHU faylga o'zi qo'shadi — quyida faqat 80 turibdi.

server {
    listen 80;
    listen [::]:80;
    server_name bormitok.uz www.bormitok.uz;

    # Telegram webhook 20 MB gacha fayl yubormaydi, lekin xabar bilan
    # kelgan foto `sveta-api` ga shu yo'l orqali tushadi.
    client_max_body_size 25m;

    access_log /var/log/nginx/bormitok.access.log;
    error_log  /var/log/nginx/bormitok.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # ⚠️ `$scheme` MAJBURIY: certbot 443 ni qo'shgandan keyin ilova
        # so'rov HTTPS bilan kelganini faqat shu sarlavhadan biladi.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
