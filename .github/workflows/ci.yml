name: CI

on:
  push:
    branches: ["**"]
  pull_request:

defaults:
  run:
    working-directory: sveta

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: sveta
          POSTGRES_PASSWORD: sveta
          POSTGRES_DB: sveta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sveta -d sveta_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://sveta:sveta@localhost:5432/sveta_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: O'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tools tests alembic

      - name: Migratsiya
        run: alembic upgrade head

      - name: Testlar
        run: pytest -q
